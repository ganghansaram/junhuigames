<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고양이 영웅 디펜스</title>
<style>
  /* ===== 화면 전체 기본 모양 ===== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #1b1530;
    color: #fff;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    display: flex;
    align-items: flex-start;   /* 패널 내용이 길어져도 캔버스가 세로로 안 늘어나게 */
    gap: 0;
    width: 960px;
    max-width: 100%;
    margin: 14px auto;
    border: 4px solid #3a2d63;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    position: relative;
  }
  /* 게임 화면(캔버스)은 점(픽셀)이 또렷하게 보이도록 설정 */
  canvas {
    display: block;
    width: 720px;            /* 표시 크기를 고정해 찌그러짐 방지 */
    height: 600px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #6fb24a;
  }
  /* 패널 높이를 캔버스와 똑같이 고정 (내용이 많으면 스크롤) */
  #panel { height: 600px; overflow-y: auto; }
  /* ===== 오른쪽 상점/정보 패널 ===== */
  #panel {
    width: 240px;
    background: #241a45;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #panel h1 {
    font-size: 15px; margin: 0; text-align: center;
    letter-spacing: -0.5px;
  }
  .hud {
    display: flex; justify-content: space-between; gap: 5px;
    font-size: 13px; font-weight: bold;
  }
  .hud div {
    background: #15102b; border-radius: 7px; padding: 5px 3px;
    flex: 1; text-align: center;
  }
  .section-title { font-size: 11px; color: #b8a8e8; }
  .shop { display: flex; flex-direction: column; gap: 5px; }
  .catbtn {
    display: flex; align-items: center; gap: 8px;
    background: #2f2456; border: 2px solid #2f2456;
    border-radius: 9px; padding: 5px 8px; cursor: pointer;
    text-align: left; color: #fff; transition: .08s;
  }
  .catbtn:hover { background: #3a2d6b; }
  .catbtn.selected { border-color: #ffd24a; background: #3a2d6b; }
  .catbtn.locked { opacity: .45; cursor: not-allowed; }
  .catbtn .ico { font-size: 20px; width: 24px; text-align: center; }
  .catbtn .info { flex: 1; min-width: 0; }
  .catbtn .nmrow { display: flex; justify-content: space-between; align-items: baseline; }
  .catbtn .nm { font-size: 12px; font-weight: bold; }
  .catbtn .cost { font-size: 12px; color: #ffd24a; font-weight: bold; }
  .catbtn .stats { font-size: 11px; color: #ffd27a; letter-spacing: -0.3px; }
  button.big {
    border: none; border-radius: 9px; padding: 8px;
    font-size: 14px; font-weight: bold; cursor: pointer; color: #1b1530;
  }
  #startWave { background: #54d27a; }
  #startWave:disabled { background: #4a5560; color: #9aa; cursor: default; }
  .row { display: flex; gap: 5px; }
  .row button { flex: 1; background: #4b3c82; color:#fff; border:none; border-radius:8px;
    padding: 7px 2px; font-size: 12px; font-weight: bold; cursor: pointer; }
  #selBox {
    background: #15102b; border-radius: 9px; padding: 7px 8px; font-size: 11px; line-height: 1.5;
    display: none;
  }
  #selBox b { color: #ffd24a; font-size: 12px; }
  #sellBtn { width: 100%; margin-top: 5px; background:#e06a6a; padding: 6px; }
  .hint { font-size: 10px; color: #9b8fce; line-height: 1.45; margin-top: auto; }
  /* ===== 시작/종료 오버레이 ===== */
  #overlay {
    position: absolute; inset: 0; background: rgba(10,6,26,.86);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; z-index: 10;
  }
  #overlay h2 { font-size: 40px; margin: 0; text-shadow: 3px 3px 0 #6b3fb0; }
  #overlay p { font-size: 15px; color: #d9ccff; margin: 0; line-height:1.7;}
  #overlay button {
    border: none; border-radius: 12px; padding: 14px 34px;
    font-size: 20px; font-weight: bold; cursor: pointer;
    background: #ffd24a; color: #1b1530;
  }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="720" height="600"></canvas>
  <div id="panel">
    <h1>🐱 고양이 영웅 디펜스</h1>
    <div class="hud">
      <div>💰 <span id="money">0</span></div>
      <div>❤️ <span id="lives">0</span></div>
      <div>🌊 <span id="wave">0</span></div>
    </div>

    <div class="section-title">🏪 상점 — 클릭 후 빈 칸에 배치 (설명: 마우스 올리기)</div>
    <div class="shop" id="shop"></div>

    <button class="big" id="startWave">▶ 웨이브 시작</button>
    <div class="row">
      <button id="speedBtn">⏩ 1x</button>
      <button id="pauseBtn">⏸</button>
      <button id="musicBtn">🎵</button>
      <button id="soundBtn">🔊</button>
    </div>

    <div id="selBox"></div>

    <div class="hint">
      적이 길 끝까지 가면 ❤️ 감소! 적을 잡아 💰를 모아 더 강한 고양이를 배치하세요. 🐱
    </div>
  </div>

  <!-- 시작 / 게임오버 화면 -->
  <div id="overlay">
    <h2>🐱 고양이 영웅 디펜스</h2>
    <p>밀려오는 쥐·강아지·박쥐 군단을 막아라!<br>영웅 고양이들을 배치해서 우리집을 지키자.</p>
    <button id="overlayBtn">시작하기</button>
  </div>
</div>

<script>
"use strict";
// =====================================================================
//  고양이 영웅 디펜스 - 클래식 타워디펜스 (픽셀아트)
//  한 파일로 동작합니다. 코드를 읽으며 어떻게 동작하는지 살펴보세요!
// =====================================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false; // 픽셀이 또렷하게 보이도록

const FIELD_W = 720, FIELD_H = 600;

// ---------------------------------------------------------------------
// 1) 길(경로) - 적들이 이 점들을 따라 차례대로 이동합니다.
// ---------------------------------------------------------------------
const WAYPOINTS = [
  {x:-30, y:90},  {x:510, y:90},
  {x:510, y:210}, {x:150, y:210},
  {x:150, y:330}, {x:570, y:330},
  {x:570, y:450}, {x:90,  y:450},
  {x:90,  y:570}, {x:750, y:570},
];

// ---------------------------------------------------------------------
// 2) 고양이를 놓을 수 있는 자리(슬롯) - 길 위가 아닌 빈 땅
// ---------------------------------------------------------------------
const SLOTS = [
  {x:90,y:150},{x:210,y:150},{x:330,y:150},{x:570,y:150},{x:690,y:150},
  {x:210,y:270},{x:330,y:270},{x:450,y:270},{x:690,y:270},
  {x:90,y:390},{x:270,y:390},{x:390,y:390},{x:510,y:390},{x:630,y:390},
  {x:150,y:510},{x:330,y:510},{x:510,y:510},{x:690,y:510},
].map(s => ({...s, cat:null}));

// ---------------------------------------------------------------------
// 3) 영웅 고양이 종류 - 비쌀수록 강하고 특별해요!
// ---------------------------------------------------------------------
const CAT_TYPES = [
  // 값 차별화 원칙:
  //  싼 고양이 = 짧은 사거리·낮은 데미지·빠른 연사 (잔손질)
  //  비싼 고양이 = 긴 사거리 / 강한 한 방 / 특수효과 (전략 무기)
  //  shape = 발사체 모양:  fish / dart / snowflake / fireball / orb
  { id:"basic",  name:"냥냥이",     ico:"🐱", cost:50,  body:"#f4a03f", outline:"#7a4a14",
    light:"#ffd9a0", markings:"#d4791f",
    range:90,  damage:7,  cooldown:0.40, projSpeed:380, proj:"#ffd27a",
    shape:"fish", desc:"물고기🐟를 던져요. 짧은 사거리·빠른 연사" },
  { id:"sniper", name:"검은 도둑냥", ico:"⚫", cost:140, body:"#3c3a4a", outline:"#16151f",
    light:"#6a6878", markings:"#3c3a4a",
    range:260, damage:55, cooldown:1.6,  projSpeed:720, proj:"#cfc6ff",
    shape:"dart", desc:"발톱 표창🗡️! 사거리 최장·강한 한 방, 느린 연사" },
  { id:"snow",   name:"눈송이냥",   ico:"❄️", cost:170, body:"#83d2ff", outline:"#2f7fb0",
    light:"#e8f8ff", markings:"#83d2ff",
    range:130, damage:6,  cooldown:0.80, projSpeed:420, proj:"#e6f7ff",
    slow:0.40, slowTime:2.0, shape:"snowflake", desc:"눈송이❄️로 적을 꽁꽁 얼려 느리게!" },
  { id:"lion",   name:"사자 갈기냥", ico:"🦁", cost:240, body:"#e8b13a", outline:"#8a5e10",
    light:"#f6dd9a", markings:"#e8b13a",
    range:115, damage:18, cooldown:1.0,  projSpeed:330, proj:"#ffcf52",
    splash:60, shape:"fireball", desc:"불덩이🔥를 쏴 범위로 여러 적 동시 타격" },
  { id:"tiger",  name:"대장 호랑냥", ico:"🐯", cost:400, body:"#f0892a", outline:"#7a3a0a",
    light:"#ffd9a0", markings:"#3a2206",
    range:160, damage:80, cooldown:0.70, projSpeed:540, proj:"#ffb24a",
    splash:45, shape:"orb", desc:"번개 기운⚡! 강한 데미지+범위, 긴 사거리" },
];
const CAT_BY_ID = Object.fromEntries(CAT_TYPES.map(c => [c.id, c]));

// ---------------------------------------------------------------------
// 4) 적 종류
// ---------------------------------------------------------------------
const ENEMY_TYPES = {
  mouse:  { name:"쥐",     hp:26,   speed:70,  reward:7,   leak:1,  px:3, body:"#c4c4cf", outline:"#6a6a76", kind:"critter" },
  dog:    { name:"강아지",  hp:72,   speed:58,  reward:12,  leak:1,  px:4, body:"#b07a44", outline:"#6e4620", kind:"critter" },
  bat:    { name:"박쥐",    hp:46,   speed:120, reward:11,  leak:1,  px:3, body:"#9b6fd6", outline:"#5a3a8a", kind:"bat" },
  bigdog: { name:"큰 개",   hp:250,  speed:40,  reward:28,  leak:2,  px:5, body:"#7a5a3a", outline:"#3e2c18", kind:"critter" },
  boss:   { name:"보스 불독", hp:1700, speed:28, reward:240, leak:10, px:7, body:"#d2453f", outline:"#7a1f1c", kind:"boss" },
};

// ---------------------------------------------------------------------
// 5) 웨이브 구성 - 점점 더 어려워집니다 (마지막은 보스!)
// ---------------------------------------------------------------------
const WAVES = [
  [{type:"mouse",count:8,gap:0.9}],
  [{type:"mouse",count:10,gap:0.7},{type:"dog",count:3,gap:1.2}],
  [{type:"dog",count:8,gap:0.9},{type:"bat",count:5,gap:0.8}],
  [{type:"bat",count:10,gap:0.6},{type:"dog",count:7,gap:0.8}],
  [{type:"bigdog",count:4,gap:1.6},{type:"mouse",count:16,gap:0.4}],
  [{type:"bat",count:14,gap:0.5},{type:"bigdog",count:6,gap:1.2}],
  [{type:"dog",count:14,gap:0.5},{type:"bigdog",count:8,gap:1.0},{type:"bat",count:10,gap:0.5}],
  [{type:"mouse",count:20,gap:0.3},{type:"bigdog",count:6,gap:1.1},{type:"boss",count:1,gap:1}],
];

// ---------------------------------------------------------------------
// 6) 픽셀아트 도안 (글자 하나가 점 하나)
//    o=외곽선 B=몸 L=밝은배 D=무늬 p=분홍(코/귀안) e=눈동자 w=눈흰자
// ---------------------------------------------------------------------
// 모든 고양이가 함께 쓰는 '귀여운 치비' 16x16 도안.
// 색(B/L/D)과 소품(코드로 그림)을 종류마다 다르게 해서 서로 달라 보이게 합니다.
const CAT_GRID = [
  "................",
  "..o........o....",
  ".oBo......oBo...",
  ".oBpo....oBpo...",
  "oBBBBBBBBBBBBBBo",
  "oBBBBDBBDBBDBBBo",
  "oBBewBBBBBBweBBo",
  "oBBeeBBBBBBeeBBo",
  "oBBBBBBppBBBBBBo",
  "oBBLBBBBBBBBLBBo",
  "oDBBBBBBBBBBBBDo",
  ".oBBBBBBBBBBBBo.",
  "..oBLLLLLLLLBo..",
  "..oBLLLLLLLLBo..",
  "..oBBLLLLLLBBo..",
  "..oBBo....oBBo..",
];
const CRITTER_GRID = [
  "............",
  "...o....o...",
  "..oBo..oBo..",
  "..oBBooBBo..",
  ".oBBBBBBBBo.",
  "oBBBBBBBBBBo",
  "oBBeBBBBeBBo",
  "oBBBBppBBBBo",
  "oBBBBBBBBBBo",
  ".oBBBBBBBBo.",
  "..oBBBBBBo..",
  "..o.o..o.o..",
];

function drawSprite(grid, palette, cx, cy, px) {
  const w = grid[0].length, h = grid.length;
  const ox = Math.round(cx - w * px / 2);
  const oy = Math.round(cy - h * px / 2);
  for (let r = 0; r < h; r++) {
    const row = grid[r];
    for (let c = 0; c < w; c++) {
      const col = palette[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(ox + c * px, oy + r * px, px, px);
    }
  }
}

// ---------------------------------------------------------------------
// 7) 게임 상태
// ---------------------------------------------------------------------
let money, lives, waveIndex, state; // state: ready/build/wave/won/lost
let enemies, projectiles, effects;
let selectedShop = null;   // 상점에서 고른 고양이 종류
let selectedCat = null;    // 필드에서 고른(배치된) 고양이
let spawnQueue, spawnIdx, spawnClock;
let gameSpeed = 1, paused = false, muted = false;
let mouse = {x:-99,y:-99};

function resetGame() {
  money = 175; lives = 15; waveIndex = 0; state = "build";
  enemies = []; projectiles = []; effects = [];
  selectedShop = null; selectedCat = null;
  SLOTS.forEach(s => s.cat = null);
  updateHUD();
}

// ---------------------------------------------------------------------
// 8) 소리 (간단한 효과음)
// ---------------------------------------------------------------------
let ac = null, bgmGain = null;
// 오디오 준비: 브라우저는 사용자가 한 번 클릭/터치하기 전에는 소리를 막아요.
// 그래서 처음 상호작용할 때 오디오를 깨워(resume) 줍니다.
function initAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      bgmGain = ac.createGain();       // 배경음악 전용 볼륨 조절기
      bgmGain.gain.value = 0.5;
      bgmGain.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
  } catch (e) {}
}
function beep(freq, dur, type, vol) {
  if (muted) return;
  try {
    initAudio();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();   // 혹시 잠들어 있으면 깨우기
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    const v = (vol || 0.05) * 2;                  // 조금 더 잘 들리도록
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(v, ac.currentTime + 0.01);
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.stop(ac.currentTime + dur + 0.02);
  } catch (e) {}
}
// 첫 클릭/키 입력 때 오디오를 깨웁니다(브라우저 자동재생 정책 대응).
["pointerdown", "keydown", "touchstart"].forEach(ev =>
  window.addEventListener(ev, initAudio, { once: false }));

// ---------------------------------------------------------------------
// 8-2) 배경음악(BGM) - 코드로 만드는 잔잔한 칩튠 루프
// ---------------------------------------------------------------------
// 음 높이(Hz). 0은 쉼표. 한 칸 = 8분음표 한 박.
const MELODY = [
  659,0, 784,0, 880,0, 784,659, 587,0, 659,0, 523,0, 587,0,   // 1~2마디
  659,0, 784,0, 1047,0, 988,880, 784,0, 659,0, 587,0, 523,0,  // 3~4마디
];
const BASS = [   // 낮은 음 화음 뿌리 (4칸마다 한 번 길게)
  131,0,0,0, 98,0,0,0, 110,0,0,0, 98,0,0,0,
  87,0,0,0, 131,0,0,0, 98,0,0,0, 131,0,0,0,
];
const STEP = 0.19;          // 한 칸 길이(초)
let bgmOn = true;           // 사용자가 켜둠/꺼둠
let bgmTimer = null, bgmStep = 0;

function bgmNote(freq, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol, ac.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(bgmGain);
  o.start(); o.stop(ac.currentTime + dur + 0.02);
}
function bgmTick() {
  if (muted || !bgmOn || !ac) { stopBgm(); return; }
  const i = bgmStep % MELODY.length;
  const m = MELODY[i]; if (m) bgmNote(m, STEP * 1.3, "triangle", 0.08);   // 멜로디
  const b = BASS[i];   if (b) bgmNote(b, STEP * 3.6, "sine", 0.12);        // 베이스
  if (i % 4 === 0) bgmNote(2000, 0.03, "square", 0.015);                   // 가벼운 박자음
  bgmStep++;
}
function startBgm() {
  initAudio();
  if (!ac || bgmTimer || !bgmOn || muted) return;
  bgmStep = 0;
  bgmTimer = setInterval(bgmTick, STEP * 1000);
}
function stopBgm() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}

// ---------------------------------------------------------------------
// 9) 적/고양이/총알 동작
// ---------------------------------------------------------------------
function spawnEnemy(type) {
  const t = ENEMY_TYPES[type];
  enemies.push({
    type, ...t, hp: t.hp, maxHp: t.hp,
    x: WAYPOINTS[0].x, y: WAYPOINTS[0].y,
    wp: 1, traveled: 0, slowTimer: 0, slowFactor: 1, dead: false,
    wob: Math.random() * 6.28,
  });
}

function updateEnemy(e, dt) {
  e.wob += dt * 8;
  if (e.slowTimer > 0) e.slowTimer -= dt;
  const sp = e.speed * (e.slowTimer > 0 ? e.slowFactor : 1);
  let move = sp * dt;
  while (move > 0 && e.wp < WAYPOINTS.length) {
    const tx = WAYPOINTS[e.wp].x, ty = WAYPOINTS[e.wp].y;
    const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
    if (d <= move) { e.x = tx; e.y = ty; e.traveled += d; move -= d; e.wp++; }
    else { e.x += dx / d * move; e.y += dy / d * move; e.traveled += move; move = 0; }
  }
  if (e.wp >= WAYPOINTS.length) { // 우리집 도착!
    lives -= e.leak; e.dead = true;
    beep(110, 0.18, "sawtooth", 0.06);
  }
}

function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  if (e.hp <= 0) {
    e.dead = true;
    money += e.reward;
    effects.push({type:"coin", x:e.x, y:e.y, t:0, life:0.8, val:e.reward});
    beep(660, 0.06, "square", 0.04);
  }
}

function fire(c, target) {
  const t = CAT_BY_ID[c.type];
  projectiles.push({
    x: c.x, y: c.y, target, speed: t.projSpeed, damage: t.damage,
    splash: t.splash || 0, slow: t.slow || 0, slowTime: t.slowTime || 0,
    color: t.proj, shape: t.shape || "fish", dead: false,
    angle: 0, spin: Math.random() * 6.28, trail: [],
  });
  // 고양이마다 발사 소리도 살짝 다르게
  const sfx = { basic:[520,0.04,"square"], sniper:[880,0.05,"triangle"],
                snow:[700,0.05,"sine"], lion:[300,0.06,"sawtooth"], tiger:[200,0.07,"sawtooth"] };
  const s = sfx[t.id]; if (s) beep(s[0], s[1], s[2], 0.03);
}

function updateCat(c, dt) {
  const t = CAT_BY_ID[c.type];
  c.cd -= dt;
  if (c.firePop > 0) c.firePop -= dt;        // 발사 점프 애니메이션 타이머
  // 사거리 안에서 '가장 앞서간' 적을 노립니다.
  let best = null, bestT = -1;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - c.x, e.y - c.y);
    if (d <= t.range && e.traveled > bestT) { best = e; bestT = e.traveled; }
  }
  c.target = best;
  // 부드럽게 적 쪽을 바라보게(꼬리 흔들 듯) 살짝 기울임
  if (best) c.face = Math.sign(best.x - c.x) || c.face || 1;
  if (best && c.cd <= 0) { c.cd = t.cooldown; c.firePop = 0.16; fire(c, best); }
}

function updateProjectile(p, dt) {
  if (!p.target || p.target.dead) { p.dead = true; return; }
  const dx = p.target.x - p.x, dy = p.target.y - p.y, d = Math.hypot(dx, dy);
  const step = p.speed * dt;
  p.angle = Math.atan2(dy, dx);                 // 날아가는 방향(표창 등에 사용)
  p.spin += dt * 10;                            // 회전(눈송이 등)
  p.trail.push({x:p.x, y:p.y});                 // 꼬리 자국(궤적)
  if (p.trail.length > 6) p.trail.shift();
  if (d <= step + 6) { // 명중!
    if (p.splash > 0) {
      for (const e of enemies) {
        if (e.dead) continue;
        if (Math.hypot(e.x - p.target.x, e.y - p.target.y) <= p.splash) {
          damageEnemy(e, p.damage);
          if (p.slow) { e.slowTimer = p.slowTime; e.slowFactor = p.slow; }
        }
      }
      effects.push({type:"ring", x:p.target.x, y:p.target.y, t:0, life:0.3, r:p.splash});
    } else {
      damageEnemy(p.target, p.damage);
      if (p.slow) { p.target.slowTimer = p.slowTime; p.target.slowFactor = p.slow; }
    }
    p.dead = true;
  } else {
    p.x += dx / d * step; p.y += dy / d * step;
  }
}

// ---------------------------------------------------------------------
// 10) 웨이브 진행
// ---------------------------------------------------------------------
function startWave() {
  if (state !== "build" || waveIndex >= WAVES.length) return;
  // 이번 웨이브에 나올 적들을 시간표로 만들어 둡니다.
  spawnQueue = []; let t = 0;
  for (const g of WAVES[waveIndex]) {
    for (let i = 0; i < g.count; i++) { spawnQueue.push({type:g.type, t}); t += g.gap; }
    t += 0.6;
  }
  spawnIdx = 0; spawnClock = 0; state = "wave";
  updateHUD();
}

function updateWaveSpawning(dt) {
  spawnClock += dt;
  while (spawnIdx < spawnQueue.length && spawnQueue[spawnIdx].t <= spawnClock) {
    spawnEnemy(spawnQueue[spawnIdx].type); spawnIdx++;
  }
  if (spawnIdx >= spawnQueue.length && enemies.length === 0) {
    // 웨이브 클리어!
    waveIndex++;
    if (waveIndex >= WAVES.length) { state = "won"; showOverlay("win"); }
    else {
      const bonus = 40 + waveIndex * 12;
      money += bonus; state = "build";
      effects.push({type:"text", x:FIELD_W/2, y:FIELD_H/2, t:0, life:1.6,
        txt:`웨이브 클리어! +💰${bonus}`});
      beep(523,0.1,"square",0.05); beep(784,0.12,"square",0.05);
    }
    updateHUD();
  }
}

// ---------------------------------------------------------------------
// 11) 메인 업데이트
// ---------------------------------------------------------------------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;          // 끊김 방지
  if (!paused && (state === "wave" || state === "build")) {
    const sdt = dt * gameSpeed;
    if (state === "wave") {
      updateWaveSpawning(sdt);
      enemies.forEach(e => updateEnemy(e, sdt));
    }
    SLOTS.forEach(s => { if (s.cat) updateCat(s.cat, sdt); });
    projectiles.forEach(p => updateProjectile(p, sdt));
    effects.forEach(f => f.t += sdt);
    enemies = enemies.filter(e => !e.dead);
    projectiles = projectiles.filter(p => !p.dead);
    effects = effects.filter(f => f.t < f.life);
    if (lives <= 0 && state !== "lost") { state = "lost"; showOverlay("lose"); }
    updateHUD();
  }
  render();
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------
// 12) 그리기
// ---------------------------------------------------------------------
function render() {
  // 잔디 배경
  ctx.fillStyle = "#6fb24a"; ctx.fillRect(0,0,FIELD_W,FIELD_H);
  // 잔디 무늬
  ctx.fillStyle = "#67a644";
  for (let y=0;y<FIELD_H;y+=24) for (let x=((y/24)%2)*24;x<FIELD_W;x+=48)
    ctx.fillRect(x,y,24,24);

  drawPath();
  drawSlots();

  // 발사체 (고양이마다 모양이 달라요)
  for (const p of projectiles) drawProjectile(p);
  // 적
  for (const e of enemies) drawEnemy(e);
  // 고양이
  for (const s of SLOTS) if (s.cat) drawCat(s.cat);
  // 선택된 고양이의 사거리 표시
  if (selectedCat) drawRange(selectedCat.x, selectedCat.y, CAT_BY_ID[selectedCat.type].range, "#ffffff");
  // 효과
  for (const f of effects) drawEffect(f);
  // 배치 미리보기(상점에서 고른 상태로 빈 칸에 마우스 올림)
  if (selectedShop) drawPlacePreview();
}

function drawPath() {
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = "#c7a86a"; ctx.lineWidth = 50;
  pathStroke();
  ctx.strokeStyle = "#d8bd86"; ctx.lineWidth = 36;
  pathStroke();
}
function pathStroke() {
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i=1;i<WAYPOINTS.length;i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();
}

function drawSlots() {
  for (const s of SLOTS) {
    if (s.cat) continue;
    const affordable = selectedShop && money >= selectedShop.cost;
    ctx.fillStyle = affordable ? "rgba(255,210,74,.35)" : "rgba(40,30,70,.25)";
    roundRect(s.x-22, s.y-22, 44, 44, 9); ctx.fill();
    ctx.strokeStyle = affordable ? "#ffd24a" : "rgba(255,255,255,.35)";
    ctx.lineWidth = 2;
    roundRect(s.x-22, s.y-22, 44, 44, 9); ctx.stroke();
    // 작은 발자국 표시
    ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 6.29); ctx.fill();
  }
}

function drawRange(x, y, r, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.globalAlpha = 0.55; ctx.lineWidth = 2;
  ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.stroke();
  ctx.globalAlpha = 0.10; ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

function catPalette(t) {
  return {o:t.outline, B:t.body, L:t.light, D:t.markings, p:"#ff9bb0", e:"#15151c", w:"#ffffff"};
}
function drawCat(c) {
  const t = CAT_BY_ID[c.type];
  const bob = Math.sin((performance.now()/260) + (c.x + c.y)) * 1.2;   // 평소 숨쉬기
  const hop = (c.firePop > 0) ? -Math.sin((c.firePop / 0.16) * Math.PI) * 5 : 0; // 발사 점프
  const x = c.x, y = c.y + bob + hop;
  // 바닥 그림자(흔들리지 않게 원래 위치 기준)
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.beginPath(); ctx.ellipse(x, c.y + 22, 15, 4.5, 0, 0, 6.29); ctx.fill();
  decorateBehind(t, x, y);                 // 꼬리·갈기·망토 (몸 뒤)
  drawSprite(CAT_GRID, catPalette(t), x, y, 3);
  decorateFront(c, t, x, y);               // 목걸이·가면·왕관 등 (몸 앞)
}

// 몸 뒤에 그리는 장식(꼬리, 사자 갈기, 호랑이 망토)
function decorateBehind(t, x, y) {
  ctx.save();
  if (t.id === "tiger") {                  // 대장님 망토
    ctx.fillStyle = "#b3322b";
    ctx.beginPath();
    ctx.moveTo(x-14, y+4); ctx.lineTo(x+14, y+4);
    ctx.lineTo(x+10, y+24); ctx.lineTo(x, y+18); ctx.lineTo(x-10, y+24); ctx.closePath(); ctx.fill();
  }
  // 꼬리 (오른쪽에서 위로 살랑)
  const sway = Math.sin(performance.now()/300 + x) * 3;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = t.outline; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(x+12, y+15);
  ctx.quadraticCurveTo(x+26, y+10, x+27 + sway, y - 6); ctx.stroke();
  ctx.strokeStyle = t.body; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x+12, y+15);
  ctx.quadraticCurveTo(x+26, y+10, x+27 + sway, y - 6); ctx.stroke();
  // 꼬리 끝 포인트색
  ctx.fillStyle = t.id === "lion" ? "#8a5e10" : t.light;
  ctx.beginPath(); ctx.arc(x+27 + sway, y - 6, 3.5, 0, 6.29); ctx.fill();

  if (t.id === "lion") {                   // 풍성한 갈기 (머리 둘레)
    ctx.fillStyle = "#c9881a";
    for (let a = 0; a < 14; a++) {
      const an = a / 14 * 6.28;
      ctx.beginPath(); ctx.arc(x + Math.cos(an) * 22, (y - 3) + Math.sin(an) * 22, 5, 0, 6.29); ctx.fill();
    }
    ctx.fillStyle = "#a86d12";
    for (let a = 0; a < 14; a++) {
      const an = (a + 0.5) / 14 * 6.28;
      ctx.beginPath(); ctx.arc(x + Math.cos(an) * 19, (y - 3) + Math.sin(an) * 19, 3, 0, 6.29); ctx.fill();
    }
  }
  ctx.restore();
}

// 몸 앞에 그리는 장식(소품). 캐릭터를 확실히 구분해줘요.
function decorateFront(c, t, x, y) {
  ctx.save();
  const blush = () => {
    ctx.fillStyle = "rgba(255,120,140,.45)";
    ctx.beginPath(); ctx.ellipse(x-10, y+1, 2.6, 1.8, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+10, y+1, 2.6, 1.8, 0, 0, 6.29); ctx.fill();
  };
  if (t.id === "basic") {                  // 🔔 빨간 목걸이 + 방울
    ctx.fillStyle = "#e0473e"; roundRect(x-13, y+8, 26, 5, 2); ctx.fill();
    ctx.fillStyle = "#ffd24a"; ctx.beginPath(); ctx.arc(x, y+12, 3.6, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#a9791a"; ctx.fillRect(x-0.6, y+11, 1.2, 3);
    blush();
  } else if (t.id === "sniper") {          // 🦝 흰 도둑 눈가면 + 노란 눈
    ctx.fillStyle = "#f1f1f6"; roundRect(x-14, y-9, 28, 8, 3); ctx.fill();
    ctx.fillStyle = "#ffe14a";
    ctx.beginPath(); ctx.ellipse(x-7, y-5, 2.6, 2, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+7, y-5, 2.6, 2, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#15151c";
    ctx.fillRect(x-8, y-6, 1.6, 3); ctx.fillRect(x+6.4, y-6, 1.6, 3);
  } else if (t.id === "snow") {            // 🧣 파란 목도리 + 머리 위 눈결정
    ctx.fillStyle = "#3aa0e0"; roundRect(x-13, y+8, 26, 6, 3); ctx.fill();
    ctx.fillRect(x+6, y+12, 5, 9);        // 늘어진 목도리 끝
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
    const cx = x, cy = y - 24;
    for (let a = 0; a < 6; a++) {
      const an = a / 6 * 6.28;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(an) * 5, cy + Math.sin(an) * 5); ctx.stroke();
    }
    blush();
  } else if (t.id === "lion") {            // 늠름한 눈썹
    ctx.fillStyle = t.outline;
    ctx.fillRect(x-9, y-8, 5, 2); ctx.fillRect(x+4, y-8, 5, 2);
  } else if (t.id === "tiger") {           // 👑 왕관 + 송곳니
    ctx.fillStyle = "#ffd24a";
    ctx.beginPath();
    ctx.moveTo(x-11, y-15); ctx.lineTo(x-11, y-21); ctx.lineTo(x-6, y-17);
    ctx.lineTo(x, y-23); ctx.lineTo(x+6, y-17); ctx.lineTo(x+11, y-21);
    ctx.lineTo(x+11, y-15); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e0473e"; ctx.beginPath(); ctx.arc(x, y-18, 1.6, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#ffffff";               // 송곳니
    ctx.beginPath(); ctx.moveTo(x-4, y+3); ctx.lineTo(x-2, y+3); ctx.lineTo(x-3, y+6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+2, y+3); ctx.lineTo(x+4, y+3); ctx.lineTo(x+3, y+6); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// 발사체를 고양이 종류(shape)에 맞게 다르게 그립니다.
function drawProjectile(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.shape === "fish") {
    // 🐟 물고기: 작은 타원 몸통 + 꼬리지느러미
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(-11,-4); ctx.lineTo(-11,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#15151c"; ctx.fillRect(3, -2, 2, 2); // 눈

  } else if (p.shape === "dart") {
    // 🗡️ 발톱 표창: 길고 빠른 바늘 + 잔상
    for (let i = 0; i < p.trail.length; i++) {
      const tp = p.trail[i]; ctx.globalAlpha = (i / p.trail.length) * 0.5;
      ctx.fillStyle = p.color;
      ctx.fillRect(tp.x - p.x - 1, tp.y - p.y - 1, 3, 3);
    }
    ctx.globalAlpha = 1; ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,-3); ctx.lineTo(-3,0); ctx.lineTo(-6,3); ctx.closePath(); ctx.fill();

  } else if (p.shape === "snowflake") {
    // ❄️ 눈송이: 회전하는 6갈래 결정 + 옅은 자국
    ctx.rotate(p.spin);
    ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.lineCap = "round";
    for (let a = 0; a < 6; a++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(2,-6); ctx.moveTo(0,-4); ctx.lineTo(-2,-6); ctx.stroke();
    }

  } else if (p.shape === "fireball") {
    // 🔥 불덩이: 깜빡이는 불꽃 글로우
    const flick = 5 + Math.sin(p.spin * 3) * 1.5;
    ctx.globalAlpha = 0.4; ctx.fillStyle = "#ff7a1a";
    ctx.beginPath(); ctx.arc(0, 0, flick + 3, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, flick, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#fff3b0";
    ctx.beginPath(); ctx.arc(0, 0, flick - 3, 0, 6.29); ctx.fill();

  } else { // orb (호랑냥) — ⚡ 번개 기운 구슬
    for (let i = 0; i < p.trail.length; i++) {
      const tp = p.trail[i]; ctx.globalAlpha = (i / p.trail.length) * 0.4;
      ctx.fillStyle = "#ffd24a";
      ctx.beginPath(); ctx.arc(tp.x - p.x, tp.y - p.y, 3, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ff7a1a";
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, 6.29); ctx.fill();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.29); ctx.fill();
    // 번개 스파크
    ctx.strokeStyle = "#fff7d0"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-7, -2); ctx.lineTo(-2, 0); ctx.lineTo(-5, 3);
    ctx.moveTo(7, -3); ctx.lineTo(2, 0); ctx.lineTo(6, 2); ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e) {
  const wob = Math.sin(e.wob) * 1.5;
  const palette = {o:e.outline, B:e.slowTimer>0?"#9fe0ff":e.body, e:"#15151c", p:"#ff9bb0"};
  if (e.kind === "bat") {
    // 날개
    ctx.fillStyle = e.outline;
    const w = e.px*5;
    ctx.beginPath();
    ctx.moveTo(e.x-6, e.y); ctx.lineTo(e.x-6-w, e.y-w*0.5+wob); ctx.lineTo(e.x-6-w*0.7, e.y+w*0.4); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(e.x+6, e.y); ctx.lineTo(e.x+6+w, e.y-w*0.5-wob); ctx.lineTo(e.x+6+w*0.7, e.y+w*0.4); ctx.closePath(); ctx.fill();
  }
  drawSprite(CRITTER_GRID, palette, e.x, e.y + wob, e.px);
  if (e.kind === "boss") { // 보스 뿔
    ctx.fillStyle = "#3a1010";
    ctx.fillRect(e.x-28, e.y-40, 6, 14); ctx.fillRect(e.x+22, e.y-40, 6, 14);
  }
  if (e.type === "mouse") { // 쥐 꼬리
    ctx.strokeStyle = e.outline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(e.x, e.y+14); ctx.quadraticCurveTo(e.x+12, e.y+18, e.x+10, e.y+6); ctx.stroke();
  }
  // 체력바
  if (e.hp < e.maxHp) {
    const w = Math.max(26, e.px*6), x = e.x - w/2, y = e.y - e.px*7 - 4;
    ctx.fillStyle = "#2a1f3a"; ctx.fillRect(x-1, y-1, w+2, 6);
    ctx.fillStyle = "#e74c4c"; ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = "#5ee06a"; ctx.fillRect(x, y, w * Math.max(0,e.hp)/e.maxHp, 4);
  }
}

function drawEffect(f) {
  const k = f.t / f.life;
  if (f.type === "coin") {
    ctx.globalAlpha = 1 - k; ctx.fillStyle = "#ffd24a";
    ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("+" + f.val, f.x, f.y - 14 - k*16); ctx.globalAlpha = 1;
  } else if (f.type === "ring") {
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = "#fff7d0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r*k, 0, 6.29); ctx.stroke(); ctx.globalAlpha = 1;
  } else if (f.type === "text") {
    ctx.globalAlpha = Math.min(1, 2-2*k); ctx.fillStyle = "#fff";
    ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.strokeStyle = "#6b3fb0"; ctx.lineWidth = 5;
    ctx.strokeText(f.txt, f.x, f.y); ctx.fillText(f.txt, f.x, f.y); ctx.globalAlpha = 1;
  }
}

function drawPlacePreview() {
  // 마우스에서 가장 가까운 빈 슬롯에 미리보기
  let near = null, nd = 9999;
  for (const s of SLOTS) {
    if (s.cat) continue;
    const d = Math.hypot(s.x-mouse.x, s.y-mouse.y);
    if (d < nd) { nd = d; near = s; }
  }
  if (near && nd < 40) {
    drawRange(near.x, near.y, selectedShop.range, "#ffd24a");
    ctx.globalAlpha = 0.65;
    decorateBehind(selectedShop, near.x, near.y);
    drawSprite(CAT_GRID, catPalette(selectedShop), near.x, near.y, 3);
    decorateFront({}, selectedShop, near.x, near.y);
    ctx.globalAlpha = 1;
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// ---------------------------------------------------------------------
// 13) 입력 (마우스 클릭으로 고양이 배치/선택)
// ---------------------------------------------------------------------
canvas.addEventListener("mousemove", ev => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (ev.clientX - r.left) * (FIELD_W / r.width);
  mouse.y = (ev.clientY - r.top) * (FIELD_H / r.height);
});
canvas.addEventListener("click", ev => {
  const r = canvas.getBoundingClientRect();
  const mx = (ev.clientX - r.left) * (FIELD_W / r.width);
  const my = (ev.clientY - r.top) * (FIELD_H / r.height);
  // 가장 가까운 슬롯 찾기
  let near = null, nd = 9999;
  for (const s of SLOTS) {
    const d = Math.hypot(s.x-mx, s.y-my);
    if (d < nd) { nd = d; near = s; }
  }
  if (!near || nd > 30) { selectedCat = null; updateSelBox(); return; }

  if (near.cat) {            // 이미 고양이가 있으면 → 선택(정보/판매)
    selectedCat = near.cat; selectedShop = null; refreshShop(); updateSelBox();
  } else if (selectedShop) { // 상점 고양이를 고른 상태면 → 배치
    if (money >= selectedShop.cost) {
      money -= selectedShop.cost;
      near.cat = { type: selectedShop.id, x: near.x, y: near.y, slot: near, cd: 0, face: 1 };
      beep(440, 0.08, "square", 0.05);
      selectedCat = near.cat; updateSelBox();
      updateHUD(); refreshShop();
    } else {
      beep(160, 0.12, "sawtooth", 0.05); // 돈 부족
    }
  } else {
    selectedCat = null; updateSelBox();
  }
});

// ---------------------------------------------------------------------
// 14) 오른쪽 패널 UI
// ---------------------------------------------------------------------
const shopEl = document.getElementById("shop");
// 연사 속도를 별(★)로 표현: 쿨다운이 짧을수록 별이 많아요.
function speedStars(cd) {
  const n = cd <= 0.45 ? 5 : cd <= 0.6 ? 4 : cd <= 0.85 ? 3 : cd <= 1.2 ? 2 : 1;
  return "★".repeat(n) + "☆".repeat(5 - n);
}
function statLine(t) {
  return `🎯${t.range}　⚔️${t.damage}　⚡${speedStars(t.cooldown)}`;
}
function buildShop() {
  shopEl.innerHTML = "";
  for (const t of CAT_TYPES) {
    const b = document.createElement("div");
    b.className = "catbtn"; b.dataset.id = t.id;
    b.title = t.desc;   // 마우스를 올리면 설명이 풍선으로 뜸
    b.innerHTML = `<div class="ico">${t.ico}</div>
      <div class="info">
        <div class="nmrow"><span class="nm">${t.name}</span><span class="cost">💰${t.cost}</span></div>
        <div class="stats">${statLine(t)}</div>
      </div>`;
    b.addEventListener("click", () => {
      selectedShop = (selectedShop && selectedShop.id === t.id) ? null : t;
      selectedCat = null; updateSelBox(); refreshShop();
    });
    shopEl.appendChild(b);
  }
}
function refreshShop() {
  for (const b of shopEl.children) {
    const t = CAT_BY_ID[b.dataset.id];
    b.classList.toggle("selected", selectedShop && selectedShop.id === t.id);
    b.classList.toggle("locked", money < t.cost);
  }
}
function updateSelBox() {
  const box = document.getElementById("selBox");
  if (!selectedCat) { box.style.display = "none"; return; }
  const t = CAT_BY_ID[selectedCat.type];
  box.style.display = "block";
  box.innerHTML = `<b>${t.ico} ${t.name}</b><br>
    🎯 사거리 ${t.range} · ⚔️ 공격력 ${t.damage}<br>
    ⚡ 연사 ${speedStars(t.cooldown)}<br>
    ${t.splash?("💥 범위공격 "+t.splash+"<br>"):""}${t.slow?("🧊 느리게 만듦<br>"):""}
    <button class="big" id="sellBtn">↩ 판매 (+💰${Math.floor(t.cost*0.6)})</button>`;
  document.getElementById("sellBtn").onclick = () => {
    money += Math.floor(t.cost * 0.6);
    selectedCat.slot.cat = null; selectedCat = null;
    updateSelBox(); updateHUD(); refreshShop();
    beep(330,0.08,"square",0.05);
  };
}
function updateHUD() {
  document.getElementById("money").textContent = money;
  document.getElementById("lives").textContent = lives;
  document.getElementById("wave").textContent = (waveIndex < WAVES.length ? waveIndex+1 : WAVES.length) + " / " + WAVES.length;
  const sw = document.getElementById("startWave");
  sw.disabled = (state !== "build");
  sw.textContent = (state === "build") ? `▶ 웨이브 ${waveIndex+1} 시작` : "⚔ 방어 중...";
  refreshShop();
}

document.getElementById("startWave").onclick = startWave;
document.getElementById("speedBtn").onclick = (e) => {
  gameSpeed = gameSpeed === 1 ? 2 : 1;
  e.target.textContent = "⏩ " + gameSpeed + "x";
};
document.getElementById("pauseBtn").onclick = (e) => {
  paused = !paused;
  e.target.textContent = paused ? "▶" : "⏸";
  if (paused) stopBgm(); else startBgm();   // 일시정지 때 음악도 멈춤
};
document.getElementById("musicBtn").onclick = (e) => {
  bgmOn = !bgmOn;
  e.target.textContent = bgmOn ? "🎵" : "🎶";
  e.target.style.opacity = bgmOn ? "1" : "0.4";
  if (bgmOn) startBgm(); else stopBgm();
};
document.getElementById("soundBtn").onclick = (e) => {
  muted = !muted; e.target.textContent = muted ? "🔇" : "🔊";
  if (muted) stopBgm(); else startBgm();     // 음소거 때 음악도 멈춤
};

// ---------------------------------------------------------------------
// 15) 시작/종료 오버레이
// ---------------------------------------------------------------------
const overlay = document.getElementById("overlay");
const overlayBtn = document.getElementById("overlayBtn");
function showOverlay(kind) {
  overlay.classList.remove("hidden");
  const h = overlay.querySelector("h2"), p = overlay.querySelector("p");
  if (kind === "win") {
    h.textContent = "🎉 승리! 🎉";
    p.innerHTML = "모든 웨이브를 막아냈어요!<br>우리집을 지킨 고양이 영웅들 만세! 🐱";
    overlayBtn.textContent = "다시하기"; beep(523,0.1); beep(659,0.1); beep(784,0.15);
  } else if (kind === "lose") {
    h.textContent = "💥 패배...";
    p.innerHTML = "적들이 우리집을 점령했어요.<br>고양이를 더 일찍, 더 많이 배치해보자!";
    overlayBtn.textContent = "다시하기";
  }
}
overlayBtn.onclick = () => {
  overlay.classList.add("hidden");
  resetGame();
  initAudio();
  startBgm();          // 게임 시작과 함께 배경음악 ON (사용자 클릭 = 자동재생 허용)
};

// ---------------------------------------------------------------------
// 16) 시작!
// ---------------------------------------------------------------------
buildShop();
resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
