<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고양이 영웅 디펜스</title>
<style>
  /* ===== 화면 전체 기본 모양 ===== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #1b1530;
    color: #fff;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    display: flex;
    align-items: flex-start;   /* 패널 내용이 길어져도 캔버스가 세로로 안 늘어나게 */
    gap: 0;
    width: 960px;
    max-width: 100%;
    margin: 14px auto;
    border: 4px solid #3a2d63;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    position: relative;
  }
  /* 게임 화면(캔버스) — 매끈한 벡터 카툰을 위해 부드럽게 렌더링 */
  canvas {
    display: block;
    width: 720px;            /* 표시 크기를 고정해 찌그러짐 방지 */
    height: 600px;
    background: #6fb24a;
  }
  /* 패널 높이를 캔버스와 똑같이 고정 (내용이 많으면 스크롤) */
  #panel { height: 600px; overflow-y: auto; }
  /* ===== 오른쪽 상점/정보 패널 ===== */
  #panel {
    width: 240px;
    background: #241a45;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #panel h1 {
    font-size: 15px; margin: 0; text-align: center;
    letter-spacing: -0.5px;
  }
  .hud {
    display: flex; justify-content: space-between; gap: 5px;
    font-size: 13px; font-weight: bold;
  }
  .hud div {
    background: #15102b; border-radius: 7px; padding: 5px 3px;
    flex: 1; text-align: center;
  }
  .section-title { font-size: 11px; color: #b8a8e8; }
  .shop { display: flex; flex-direction: column; gap: 5px; }
  .catbtn {
    display: flex; align-items: center; gap: 8px;
    background: #2f2456; border: 2px solid #2f2456;
    border-radius: 9px; padding: 5px 8px; cursor: pointer;
    text-align: left; color: #fff; transition: .08s;
  }
  .catbtn:hover { background: #3a2d6b; }
  .catbtn.selected { border-color: #ffd24a; background: #3a2d6b; }
  .catbtn.locked { opacity: .45; cursor: not-allowed; }
  .catbtn .ico { font-size: 19px; width: 28px; height: 28px; line-height: 26px; text-align: center; border-radius: 7px; }
  .catbtn .info { flex: 1; min-width: 0; }
  .catbtn .nmrow { display: flex; justify-content: space-between; align-items: baseline; }
  .catbtn .nm { font-size: 12px; font-weight: bold; }
  .catbtn .rar { font-size: 9px; font-weight: bold; }
  .catbtn .cost { font-size: 12px; color: #ffd24a; font-weight: bold; }
  .catbtn .stats { font-size: 11px; color: #ffd27a; letter-spacing: -0.3px; }
  button.big {
    border: none; border-radius: 9px; padding: 8px;
    font-size: 14px; font-weight: bold; cursor: pointer; color: #1b1530;
  }
  #startWave { background: #54d27a; }
  #startWave:disabled { background: #4a5560; color: #9aa; cursor: default; }
  .row { display: flex; gap: 5px; }
  .row button { flex: 1; background: #4b3c82; color:#fff; border:none; border-radius:8px;
    padding: 7px 2px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .row button.skill { background: #6a3aa0; padding: 8px 2px; }
  .row button.skill.armed { background: #ff8a3a; color:#1b1530; box-shadow: 0 0 0 2px #ffd24a; }
  .row button.skill:disabled { background: #3a3050; color:#8a82a8; cursor: default; }
  #diffRow { display: flex; gap: 10px; }
  #diffRow button { border:none; border-radius:12px; padding:14px 22px; font-size:18px;
    font-weight:bold; cursor:pointer; color:#1b1530; }
  #selBox {
    background: #15102b; border-radius: 9px; padding: 7px 8px; font-size: 11px; line-height: 1.5;
    display: none;
  }
  #selBox b { color: #ffd24a; font-size: 12px; }
  #sellBtn { width: 100%; margin-top: 5px; background:#e06a6a; padding: 6px; }
  .hint { font-size: 10px; color: #9b8fce; line-height: 1.45; margin-top: auto; }
  /* ===== 시작/종료 오버레이 ===== */
  #overlay {
    position: absolute; inset: 0; background: rgba(10,6,26,.86);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; z-index: 10;
  }
  #overlay h2 { font-size: 40px; margin: 0; text-shadow: 3px 3px 0 #6b3fb0; }
  #overlay p { font-size: 15px; color: #d9ccff; margin: 0; line-height:1.7;}
  #overlay button {
    border: none; border-radius: 12px; padding: 14px 34px;
    font-size: 20px; font-weight: bold; cursor: pointer;
    background: #ffd24a; color: #1b1530;
  }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="720" height="600"></canvas>
  <div id="panel">
    <h1>🐱 고양이 영웅 디펜스</h1>
    <div class="hud">
      <div>💰 <span id="money">0</span></div>
      <div>❤️ <span id="lives">0</span></div>
      <div>🌊 <span id="wave">0</span></div>
    </div>

    <div class="section-title">🏪 상점 — 클릭 후 빈 칸에 배치 (설명: 마우스 올리기)</div>
    <div class="shop" id="shop"></div>

    <button class="big" id="startWave">▶ 웨이브 시작</button>
    <div class="row">
      <button id="skillMeteor" class="skill">🔥 불벼락</button>
      <button id="skillBlizzard" class="skill">❄️ 눈보라</button>
    </div>
    <div class="row">
      <button id="speedBtn">⏩ 1x</button>
      <button id="pauseBtn">⏸</button>
      <button id="musicBtn">🎵</button>
      <button id="soundBtn">🔊</button>
    </div>

    <div id="selBox"></div>

    <div class="hint">
      적이 우리집🏠에 닿으면 ❤️ 감소! 💰를 모아 고양이를 배치·업그레이드하세요. 🐱
    </div>
  </div>

  <!-- 시작 / 게임오버 화면 -->
  <div id="overlay">
    <h2>🐱 고양이 영웅 디펜스</h2>
    <p>밀려오는 군단을 막아라!<br>난이도를 골라 시작하세요.</p>
    <div id="diffRow"></div>
    <button id="overlayBtn" style="display:none">시작하기</button>
  </div>
</div>

<script>
"use strict";
// =====================================================================
//  고양이 영웅 디펜스 - 클래식 타워디펜스 (픽셀아트)
//  한 파일로 동작합니다. 코드를 읽으며 어떻게 동작하는지 살펴보세요!
// =====================================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = true; // 벡터 카툰을 부드럽게

const FIELD_W = 720, FIELD_H = 600;

// ---------------------------------------------------------------------
// 1) 길(경로) - 적들이 이 점들을 따라 차례대로 이동합니다.
// ---------------------------------------------------------------------
const WAYPOINTS = [
  {x:-30, y:90},  {x:510, y:90},
  {x:510, y:210}, {x:150, y:210},
  {x:150, y:330}, {x:570, y:330},
  {x:570, y:450}, {x:90,  y:450},
  {x:90,  y:570}, {x:750, y:570},
];

// ---------------------------------------------------------------------
// 2) 고양이를 놓을 수 있는 자리(슬롯) - 길 위가 아닌 빈 땅
// ---------------------------------------------------------------------
const SLOTS = [
  {x:90,y:150},{x:210,y:150},{x:330,y:150},{x:570,y:150},{x:690,y:150},
  {x:210,y:270},{x:330,y:270},{x:450,y:270},{x:690,y:270},
  {x:90,y:390},{x:270,y:390},{x:390,y:390},{x:510,y:390},{x:630,y:390},
  {x:150,y:510},{x:330,y:510},{x:510,y:510},{x:690,y:510},
].map(s => ({...s, cat:null}));

// ---------------------------------------------------------------------
// 3) 영웅 고양이 종류 - 비쌀수록 강하고 특별해요!
// ---------------------------------------------------------------------
const CAT_TYPES = [
  // 값 차별화 원칙:
  //  싼 고양이 = 짧은 사거리·낮은 데미지·빠른 연사 (잔손질)
  //  비싼 고양이 = 긴 사거리 / 강한 한 방 / 특수효과 (전략 무기)
  //  shape = 발사체 모양:  fish / dart / snowflake / fireball / orb
  { id:"basic",  name:"냥냥이",     ico:"🐱", cost:50,  body:"#f4a03f", outline:"#7a4a14",
    light:"#ffd9a0", markings:"#d4791f",
    range:90,  damage:7,  cooldown:0.40, projSpeed:380, proj:"#ffd27a",
    shape:"fish", air:false, desc:"물고기🐟를 던져요. 짧은 사거리·빠른 연사 (지상만)" },
  { id:"sniper", name:"검은 도둑냥", ico:"⚫", cost:140, body:"#3c3a4a", outline:"#16151f",
    light:"#6a6878", markings:"#3c3a4a",
    range:260, damage:55, cooldown:1.6,  projSpeed:720, proj:"#cfc6ff",
    shape:"dart", air:true, desc:"발톱 표창🗡️! 사거리 최장·강한 한 방 (비행 가능)" },
  { id:"snow",   name:"눈송이냥",   ico:"❄️", cost:170, body:"#83d2ff", outline:"#2f7fb0",
    light:"#e8f8ff", markings:"#83d2ff",
    range:130, damage:6,  cooldown:0.80, projSpeed:420, proj:"#e6f7ff",
    slow:0.40, slowTime:2.0, shape:"snowflake", air:true, desc:"눈송이❄️로 적을 얼려 느리게! (비행 가능)" },
  { id:"lion",   name:"사자 갈기냥", ico:"🦁", cost:240, body:"#e8b13a", outline:"#8a5e10",
    light:"#f6dd9a", markings:"#e8b13a",
    range:115, damage:18, cooldown:1.0,  projSpeed:330, proj:"#ffcf52",
    splash:60, shape:"fireball", air:false, desc:"불덩이🔥로 범위 공격! 여러 적 동시 타격 (지상만)" },
  { id:"tiger",  name:"대장 호랑냥", ico:"🐯", cost:400, body:"#f0892a", outline:"#7a3a0a",
    light:"#ffd9a0", markings:"#3a2206",
    range:160, damage:80, cooldown:0.70, projSpeed:540, proj:"#ffb24a",
    splash:45, shape:"orb", air:true, desc:"번개 기운⚡! 강한 데미지+범위 (비행 가능)" },
];
const CAT_BY_ID = Object.fromEntries(CAT_TYPES.map(c => [c.id, c]));

// ---------------------------------------------------------------------
// 4) 적 종류
// ---------------------------------------------------------------------
const ENEMY_TYPES = {
  mouse:  { name:"쥐",     hp:26,   speed:70,  reward:7,   leak:1,  px:3, art:"mouse", style:"mouse",
            body:"#c4c4cf", outline:"#6a6a76", light:"#e9e9f2", dark:"#9a9aa6", eye:"#15151c" },
  dog:    { name:"강아지",  hp:72,   speed:58,  reward:12,  leak:1,  px:3, art:"dog", style:"dog",
            body:"#b07a44", outline:"#6e4620", light:"#e8c79a", dark:"#7a5230", eye:"#15151c" },
  bat:    { name:"박쥐",    hp:46,   speed:120, reward:11,  leak:1,  px:3, art:"bat", style:"bat",
            body:"#9b6fd6", outline:"#5a3a8a", light:"#c4a4ee", dark:"#7a52b0", eye:"#ffe14a" },
  bigdog: { name:"큰 개",   hp:250,  speed:40,  reward:28,  leak:2,  px:4, art:"dog", style:"bigdog",
            armor:5, body:"#7a5a3a", outline:"#352314", light:"#b89a72", dark:"#4a3320", eye:"#15151c" },
  // 🆕 비행 유령 — 지상만 공격하는 고양이는 못 맞혀요!
  ghost:  { name:"유령",   hp:64,   speed:95,  reward:14,  leak:1,  px:3, art:"bat", style:"ghost", flying:true,
            body:"#e2ecff", outline:"#93a6cf", light:"#ffffff", dark:"#c2d2ee", eye:"#8a6fd0" },
  // 🆕 방패견 — 파란 보호막(방패)을 먼저 깨야 해요
  shielddog:{ name:"방패견", hp:90,  speed:50,  reward:24,  leak:1,  px:4, art:"dog", style:"shielddog", shield:80,
            body:"#5aa0a0", outline:"#2f6060", light:"#c2eaea", dark:"#3f7878", eye:"#15151c" },
  boss:   { name:"보스 불독", hp:1700, speed:28, reward:240, leak:10, px:6, art:"dog", style:"boss",
            armor:8, body:"#d2453f", outline:"#6e1c19", light:"#f0a09a", dark:"#a02f2b", eye:"#15151c" },
};

// ---------------------------------------------------------------------
// 5) 웨이브 구성 - 점점 더 어려워집니다 (마지막은 보스!)
// ---------------------------------------------------------------------
const WAVES = [
  [{type:"mouse",count:8,gap:0.9}],
  [{type:"mouse",count:10,gap:0.7},{type:"dog",count:3,gap:1.2}],
  [{type:"dog",count:8,gap:0.9},{type:"bat",count:5,gap:0.8}],
  [{type:"bat",count:10,gap:0.6},{type:"dog",count:7,gap:0.8}],
  [{type:"bigdog",count:4,gap:1.6},{type:"ghost",count:5,gap:0.7},{type:"mouse",count:12,gap:0.4}],
  [{type:"ghost",count:8,gap:0.5},{type:"shielddog",count:4,gap:1.1},{type:"bigdog",count:4,gap:1.2}],
  [{type:"shielddog",count:6,gap:0.8},{type:"ghost",count:10,gap:0.4},{type:"bigdog",count:8,gap:1.0}],
  [{type:"ghost",count:12,gap:0.3},{type:"shielddog",count:6,gap:0.9},{type:"bigdog",count:6,gap:1.1},{type:"boss",count:1,gap:1}],
];

// ---------------------------------------------------------------------
// 6) 픽셀아트 도안 (글자 하나가 점 하나)
//    o=외곽선 B=몸 L=밝은배 D=무늬 p=분홍(코/귀안) e=눈동자 w=눈흰자
// ---------------------------------------------------------------------
// 모든 고양이가 함께 쓰는 '귀여운 치비' 16x16 도안.
// 색(B/L/D)과 소품(코드로 그림)을 종류마다 다르게 해서 서로 달라 보이게 합니다.
const CAT_GRID = [
  "................",
  "..o........o....",
  ".oBo......oBo...",
  ".oBpo....oBpo...",
  "oBBBBBBBBBBBBBBo",
  "oBBBBDBBDBBDBBBo",
  "oBBewBBBBBBweBBo",
  "oBBeeBBBBBBeeBBo",
  "oBBBBBBppBBBBBBo",
  "oBBLBBBBBBBBLBBo",
  "oDBBBBBBBBBBBBDo",
  ".oBBBBBBBBBBBBo.",
  "..oBLLLLLLLLBo..",
  "..oBLLLLLLLLBo..",
  "..oBBLLLLLLBBo..",
  "..oBBo....oBBo..",
];
// 적 도안들 (귀엽지만 장난꾸러기 느낌)
const MOUSE_GRID = [
  ".ooo.....ooo.",
  ".oppo...oppo.",
  ".oppo...oppo.",
  "..oBBBBBBBo..",
  ".oBBBBBBBBBo.",
  ".oBBeBBBeBBo.",
  ".oBBBBBBBBBo.",
  "..oBBBpBBBo..",
  "..oBLLLLLBo..",
  "..oBLLLLLBo..",
  "...oBBBBBo...",
  "...oBo.oBo...",
];
const DOG_GRID = [
  "...oBBBBBBBo...",
  "..oBBBBBBBBBo..",
  ".DDoBBBBBBBoDD.",
  "DDDoBeBBBeBoDDD",
  ".DDoBBBBBBBoDD.",
  "..oBBBLLLBBBo..",
  "..oBBBLeeLBBo..",
  "..oBBBLppLBBo..",
  ".oBBBBBBBBBBBo.",
  ".oBLLLLLLLLLBo.",
  ".oBLLLLLLLLLBo.",
  ".oBBLLLLLLLBBo.",
  "..oBBo..oBBo...",
];
const BAT_GRID = [
  "..o.....o..",
  ".oBo...oBo.",
  ".oBBo.oBBo.",
  ".oBBBBBBBo.",
  "oBwwBBBwwBo",
  "oBeeBBBeeBo",
  "oBBBBBBBBBo",
  ".oBBBBBBBo.",
  "..oBBBBBo..",
  "...oo.oo...",
];
const ENEMY_GRIDS = { mouse: MOUSE_GRID, dog: DOG_GRID, bat: BAT_GRID };

function drawSprite(grid, palette, cx, cy, px) {
  const w = grid[0].length, h = grid.length;
  const ox = Math.round(cx - w * px / 2);
  const oy = Math.round(cy - h * px / 2);
  for (let r = 0; r < h; r++) {
    const row = grid[r];
    for (let c = 0; c < w; c++) {
      const col = palette[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(ox + c * px, oy + r * px, px, px);
    }
  }
}

// ===== 매끈한 벡터 캐릭터(두꺼운 외곽선 카툰) =====
// 작은 도형 헬퍼: 채우고, 필요하면 외곽선까지.
function vEll(x, y, rx, ry, fill, outline, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.29);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (outline) { ctx.strokeStyle = outline; ctx.lineWidth = lw || 2.6; ctx.stroke(); }
}
function vTri(x1,y1,x2,y2,x3,y3, fill, outline, lw) {
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (outline) { ctx.strokeStyle = outline; ctx.lineWidth = lw || 2.6; ctx.stroke(); }
}

// 고양이 몸(머리·귀·눈·몸통). 소품은 decorateBehind/Front 가 따로 그립니다.
function drawCatBody(t, x, y) {
  const O = t.outline, B = t.body, L = t.light, D = t.markings;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  // 몸통
  vEll(x, y+13, 13, 12, B, O, 3);
  vEll(x, y+16, 7.5, 7, L, null);
  // 귀(삼각형) — 머리보다 먼저 그려 머리에 밑동이 가려지게
  vTri(x-11,y-25, x-17,y-12, x-3,y-13, B, O, 3);
  vTri(x+11,y-25, x+17,y-12, x+3,y-13, B, O, 3);
  vTri(x-11,y-22, x-14,y-14, x-7,y-14, "#ff9bb0", null);
  vTri(x+11,y-22, x+14,y-14, x+7,y-14, "#ff9bb0", null);
  // 머리
  vEll(x, y-3, 16, 14, B, O, 3);
  // 줄무늬(냥냥이/호랑냥)
  if (D && D !== B) {
    ctx.strokeStyle = D; ctx.lineWidth = 2.6;
    [-6,0,6].forEach(dx => { ctx.beginPath(); ctx.moveTo(x+dx, y-15); ctx.lineTo(x+dx, y-9); ctx.stroke(); });
  }
  // 볼(밝은색)
  vEll(x, y+1, 9, 6, L, null);
  // 눈 + 하이라이트
  vEll(x-6, y-3, 3.1, 4, "#15151c", null);
  vEll(x+6, y-3, 3.1, 4, "#15151c", null);
  ctx.fillStyle = "#fff";
  vEll(x-5, y-5, 1.3, 1.5, "#fff", null); vEll(x+7, y-5, 1.3, 1.5, "#fff", null);
  // 코
  vTri(x-2.4, y, x+2.4, y, x, y+3, "#ff9bb0", null);
}

// 적 몸(쥐/강아지/박쥐). tint를 주면 그 색 실루엣만(피격 번쩍·얼음용).
function drawEnemyBody(e, px, tint) {
  const u = px, O = e.outline, sk = !tint;
  const B = tint || e.body, L = tint || e.light, D = tint || e.dark, EYE = tint || e.eye;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  const ell = (cx,cy,rx,ry,f) => vEll(cx*u, cy*u, rx*u, ry*u, f, sk ? O : null, 2.2);
  const dot = (cx,cy,r,f) => { ctx.fillStyle = f; ctx.beginPath(); ctx.ellipse(cx*u, cy*u, r*u, r*u, 0, 0, 6.29); ctx.fill(); };

  if (e.art === "mouse") {
    ell(0,2.2, 4, 4, B);
    if (sk) ell(0,3.2, 2.3, 2.3, L);
    ell(-3.4,-4.2, 2.1, 2.1, B); ell(3.4,-4.2, 2.1, 2.1, B);       // 큰 귀
    if (sk) { dot(-3.4,-4.2, 1.1, "#ff9bb0"); dot(3.4,-4.2, 1.1, "#ff9bb0"); }
    ell(0,-1, 4.4, 3.8, B);
    if (sk) { dot(-1.6,-1, 0.95, EYE); dot(1.6,-1, 0.95, EYE);
      dot(-1.3,-1.3, 0.35, "#fff"); dot(1.9,-1.3, 0.35, "#fff"); dot(0,0.7, 0.7, "#ff9bb0"); }
  } else if (e.art === "dog") {
    ell(-4.6,0.2, 1.7, 3, D); ell(4.6,0.2, 1.7, 3, D);             // 늘어진 귀
    ell(0,2.7, 5, 4.6, B);
    if (sk) ell(0,3.7, 3, 3, L);
    ell(0,-1, 5, 4.3, B);
    if (sk) { ell(0,1.1, 2.7, 2.1, L); dot(-2,-1.4, 1, EYE); dot(2,-1.4, 1, EYE);
      dot(0,0.5, 1, "#15151c"); }
  } else { // bat / ghost
    ell(0,1, 3.6, 3.4, B);
    vTri(-2.6*u,-4.8*u, -0.8*u,-2.0*u, -3.8*u,-2.2*u, B, sk?O:null, 2.2);
    vTri(2.6*u,-4.8*u, 0.8*u,-2.0*u, 3.8*u,-2.2*u, B, sk?O:null, 2.2);
    if (sk) { dot(-1.8,-0.6, 1.1, "#fff"); dot(1.8,-0.6, 1.1, "#fff");
      dot(-1.8,-0.5, 0.6, EYE); dot(1.8,-0.5, 0.6, EYE); }
  }
}

// ===== 파티클(이펙트) 시스템 =====
// 작은 입자들을 뿌려 타격/폭발/연기/반짝임을 표현합니다.
function spawnParticles(x, y, n, opt) {
  for (let i = 0; i < n; i++) {
    const a = opt.dir !== undefined ? opt.dir + (Math.random()-0.5)*(opt.spread||6.28)
                                    : Math.random()*6.28;
    const sp = (opt.speed||80) * (0.4 + Math.random()*0.8);
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - (opt.lift||0),
      life: (opt.life||0.4)*(0.7+Math.random()*0.6), maxLife: opt.life||0.4,
      size: (opt.size||3)*(0.6+Math.random()*0.8),
      grav: opt.grav||0, color: opt.color, grow: opt.grow||0, kind: opt.kind||"spark",
    });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.grav*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.size += p.grow*dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0 && p.size > 0.3);
}
function drawParticles() {
  for (const p of particles) {
    const k = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = p.kind === "smoke" ? k*0.5 : k;
    ctx.fillStyle = p.color;
    if (p.kind === "star") {
      star(p.x, p.y, p.size, p.size*0.5); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.29); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------
// 8) 소리 (간단한 효과음)
// ---------------------------------------------------------------------
let ac = null, bgmGain = null;
// 오디오 준비: 브라우저는 사용자가 한 번 클릭/터치하기 전에는 소리를 막아요.
// 그래서 처음 상호작용할 때 오디오를 깨워(resume) 줍니다.
function initAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      bgmGain = ac.createGain();       // 배경음악 전용 볼륨 조절기
      bgmGain.gain.value = 0.5;
      bgmGain.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
  } catch (e) {}
}
function beep(freq, dur, type, vol) {
  if (muted) return;
  try {
    initAudio();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();   // 혹시 잠들어 있으면 깨우기
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    const v = (vol || 0.05) * 2;                  // 조금 더 잘 들리도록
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(v, ac.currentTime + 0.01);
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.stop(ac.currentTime + dur + 0.02);
  } catch (e) {}
}
// 첫 클릭/키 입력 때 오디오를 깨웁니다(브라우저 자동재생 정책 대응).
["pointerdown", "keydown", "touchstart"].forEach(ev =>
  window.addEventListener(ev, initAudio, { once: false }));

// ---------------------------------------------------------------------
// 8-2) 배경음악(BGM) - 코드로 만드는 잔잔한 칩튠 루프
// ---------------------------------------------------------------------
// 음 높이(Hz). 0은 쉼표. 한 칸 = 8분음표 한 박.
const MELODY = [
  659,0, 784,0, 880,0, 784,659, 587,0, 659,0, 523,0, 587,0,   // 1~2마디
  659,0, 784,0, 1047,0, 988,880, 784,0, 659,0, 587,0, 523,0,  // 3~4마디
];
const BASS = [   // 낮은 음 화음 뿌리 (4칸마다 한 번 길게)
  131,0,0,0, 98,0,0,0, 110,0,0,0, 98,0,0,0,
  87,0,0,0, 131,0,0,0, 98,0,0,0, 131,0,0,0,
];
const STEP = 0.19;          // 한 칸 길이(초)
let bgmOn = true;           // 사용자가 켜둠/꺼둠
let bgmTimer = null, bgmStep = 0;

function bgmNote(freq, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol, ac.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(bgmGain);
  o.start(); o.stop(ac.currentTime + dur + 0.02);
}
function bgmTick() {
  if (muted || !bgmOn || !ac) { stopBgm(); return; }
  const i = bgmStep % MELODY.length;
  const m = MELODY[i]; if (m) bgmNote(m, STEP * 1.3, "triangle", 0.08);   // 멜로디
  const b = BASS[i];   if (b) bgmNote(b, STEP * 3.6, "sine", 0.12);        // 베이스
  if (i % 4 === 0) bgmNote(2000, 0.03, "square", 0.015);                   // 가벼운 박자음
  bgmStep++;
}
function startBgm() {
  initAudio();
  if (!ac || bgmTimer || !bgmOn || muted) return;
  bgmStep = 0;
  bgmTimer = setInterval(bgmTick, STEP * 1000);
}
function stopBgm() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}

// ---------------------------------------------------------------------
// 9) 적/고양이/총알 동작
// ---------------------------------------------------------------------
function spawnEnemy(type) {
  const t = ENEMY_TYPES[type];
  const hp = Math.round(t.hp * DIFFS[difficulty].hpMul);
  enemies.push({
    type, ...t, hp, maxHp: hp,
    armor: t.armor || 0, shield: t.shield || 0, maxShield: t.shield || 0, flying: !!t.flying,
    x: WAYPOINTS[0].x, y: WAYPOINTS[0].y,
    wp: 1, traveled: 0, slowTimer: 0, slowFactor: 1, dead: false,
    wob: Math.random() * 6.28, flash: 0, face: 1,
  });
}

function updateEnemy(e, dt) {
  e.wob += dt * 8;
  if (e.flash > 0) e.flash -= dt;
  if (e.slowTimer > 0) e.slowTimer -= dt;
  const sp = e.speed * (e.slowTimer > 0 ? e.slowFactor : 1);
  let move = sp * dt;
  const startX = e.x;                          // 이동 방향(좌우)을 알아내기 위해
  while (move > 0 && e.wp < WAYPOINTS.length) {
    const tx = WAYPOINTS[e.wp].x, ty = WAYPOINTS[e.wp].y;
    const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
    if (d <= move) { e.x = tx; e.y = ty; e.traveled += d; move -= d; e.wp++; }
    else { e.x += dx / d * move; e.y += dy / d * move; e.traveled += move; move = 0; }
  }
  const movedX = e.x - startX;                 // 가로로 움직였으면 그 방향을 바라봄
  if (Math.abs(movedX) > 0.01) e.face = movedX > 0 ? 1 : -1;
  if (e.wp >= WAYPOINTS.length) { // 우리집 도착!
    lives -= e.leak; e.dead = true;
    hurtFlash = 1; shake = Math.min(10, shake + 4 + e.leak);
    beep(110, 0.18, "sawtooth", 0.06);
  }
}

function damageEnemy(e, dmg) {
  if (e.dead) return;
  let real = Math.max(1, dmg - (e.armor || 0));   // 갑옷이 데미지를 깎음
  e.flash = 0.1;                 // 맞으면 하얗게 번쩍
  if (e.shield > 0) {            // 보호막을 먼저 깎음(넘치면 체력으로)
    e.shield -= real;
    if (e.shield < 0) { e.hp += e.shield; e.shield = 0;
      spawnParticles(e.x, e.y, 8, {color:"#9be8ff", speed:120, size:2.2, life:0.35}); }
  } else {
    e.hp -= real;
  }
  // 떠오르는 데미지 숫자
  effects.push({type:"dmg", x:e.x + (Math.random()-0.5)*10, y:e.y - 6, t:0, life:0.55,
    val:real, big:real >= 40});
  if (e.hp <= 0) {
    e.dead = true;
    money += e.reward;
    effects.push({type:"coin", x:e.x, y:e.y, t:0, life:0.9, val:e.reward});
    // 펑! 연기 + 별 반짝임 + 코인 튀기기
    for (let i = 0; i < 5; i++) {
      effects.push({type:"poof", x:e.x, y:e.y, t:0, life:0.4,
        dx:(Math.random()-0.5)*40, dy:(Math.random()-0.7)*40, r:e.px*1.6 + Math.random()*4});
    }
    spawnParticles(e.x, e.y, 8, {color:"#fff3b0", speed:120, size:2.6, life:0.5, grav:90, kind:"star"});
    spawnParticles(e.x, e.y, 6, {color:e.body, speed:90, size:2.6, life:0.4, grav:120});
    if (e.style === "boss") shake = Math.min(12, shake + 8);   // 보스 폭사 흔들림
    beep(660, 0.06, "square", 0.04);
  }
}

// ===== 고양이 업그레이드: 레벨에 따른 '실제 스탯' 계산 =====
const MAX_LEVEL = 3;
function catStat(c) {
  const t = CAT_BY_ID[c.type];
  const L = (c.level || 1) - 1;                 // 0,1,2
  return {
    ...t,
    range:    t.range    * (1 + 0.12 * L),      // 사거리 +12%/레벨
    damage:   Math.round(t.damage * (1 + 0.6 * L)), // 공격력 +60%/레벨
    cooldown: t.cooldown * (1 - 0.12 * L),      // 연사 12%씩 빨라짐
    splash:   t.splash ? Math.round(t.splash * (1 + 0.12 * L)) : 0,
  };
}
// 다음 레벨로 올리는 비용 (현재 레벨 기준)
function upgradeCost(c) {
  const base = CAT_BY_ID[c.type].cost;
  return Math.ceil(base * (c.level === 1 ? 0.9 : 1.5));
}

function fire(c, target) {
  const s = catStat(c);
  projectiles.push({
    x: c.x, y: c.y, target, speed: s.projSpeed, damage: s.damage,
    splash: s.splash || 0, slow: s.slow || 0, slowTime: s.slowTime || 0,
    color: s.proj, shape: s.shape || "fish", dead: false,
    angle: 0, spin: Math.random() * 6.28, trail: [],
  });
  // 총구 섬광(작은 발광 입자) — 적 방향으로 살짝
  const ang = Math.atan2(target.y - c.y, target.x - c.x);
  effects.push({type:"flash", x:c.x + Math.cos(ang)*12, y:c.y + Math.sin(ang)*12 - 4, t:0, life:0.1, r:9});
  // 고양이마다 발사 소리도 살짝 다르게
  const sfx = { basic:[520,0.04,"square"], sniper:[880,0.05,"triangle"],
                snow:[700,0.05,"sine"], lion:[300,0.06,"sawtooth"], tiger:[200,0.07,"sawtooth"] };
  const sx = sfx[c.type]; if (sx) beep(sx[0], sx[1], sx[2], 0.03);
}

// 타겟 우선순위에서 '더 좋은' 후보인지 비교
function betterTarget(mode, e, best) {
  if (!best) return true;
  if (mode === "last")   return e.traveled < best.traveled;
  if (mode === "strong") return (e.hp + e.shield) > (best.hp + best.shield);
  if (mode === "weak")   return (e.hp + e.shield) < (best.hp + best.shield);
  return e.traveled > best.traveled;        // first(기본): 가장 앞선 적
}
function updateCat(c, dt) {
  const s = catStat(c);
  const air = CAT_BY_ID[c.type].air;        // 비행 적을 칠 수 있나?
  const mode = c.targeting || "first";
  c.cd -= dt;
  if (c.firePop > 0) c.firePop -= dt;        // 발사 점프 애니메이션 타이머
  // 사거리 안에서 우선순위에 맞는 적을 고릅니다.
  let best = null;
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.flying && !air) continue;          // 지상 전용 고양이는 비행 적 무시
    if (Math.hypot(e.x - c.x, e.y - c.y) > s.range) continue;
    if (betterTarget(mode, e, best)) best = e;
  }
  c.target = best;
  if (best) c.face = Math.sign(best.x - c.x) || c.face || 1;
  if (best && c.cd <= 0) { c.cd = s.cooldown; c.firePop = 0.16; fire(c, best); }
}

function updateProjectile(p, dt) {
  if (!p.target || p.target.dead) { p.dead = true; return; }
  const dx = p.target.x - p.x, dy = p.target.y - p.y, d = Math.hypot(dx, dy);
  const step = p.speed * dt;
  p.angle = Math.atan2(dy, dx);                 // 날아가는 방향(표창 등에 사용)
  p.spin += dt * 10;                            // 회전(눈송이 등)
  p.trail.push({x:p.x, y:p.y});                 // 꼬리 자국(궤적)
  if (p.trail.length > 6) p.trail.shift();
  if (d <= step + 6) { // 명중!
    if (p.splash > 0) {
      for (const e of enemies) {
        if (e.dead) continue;
        if (Math.hypot(e.x - p.target.x, e.y - p.target.y) <= p.splash) {
          damageEnemy(e, p.damage);
          if (p.slow) { e.slowTimer = p.slowTime; e.slowFactor = p.slow; }
        }
      }
      // 💥 폭발 연출: 섬광 링 + 불꽃 + 연기 + 화면 흔들림
      effects.push({type:"ring", x:p.target.x, y:p.target.y, t:0, life:0.3, r:p.splash});
      effects.push({type:"flash", x:p.target.x, y:p.target.y, t:0, life:0.18, r:p.splash*0.8});
      spawnParticles(p.target.x, p.target.y, 16, {color:"#ffb24a", speed:170, size:3.5, life:0.45, grav:120});
      spawnParticles(p.target.x, p.target.y, 8,  {color:"#ff6a2a", speed:110, size:3, life:0.4, grav:80});
      spawnParticles(p.target.x, p.target.y, 6,  {color:"#cfcfcf", speed:50, size:5, life:0.6, lift:30, grow:14, kind:"smoke"});
      shake = Math.min(9, shake + 5);
    } else {
      damageEnemy(p.target, p.damage);
      if (p.slow) { p.target.slowTimer = p.slowTime; p.target.slowFactor = p.slow; }
      // 작은 타격 불꽃
      spawnParticles(p.x, p.y, 6, {color:p.color, speed:120, size:2.4, life:0.25, grav:60});
    }
    p.dead = true;
  } else {
    p.x += dx / d * step; p.y += dy / d * step;
  }
}

// ===== 필살기 시전 =====
function castMeteor(x, y) {
  const sk = SKILLS.meteor;
  for (const e of enemies) {
    if (e.dead) continue;
    if (Math.hypot(e.x - x, e.y - y) <= sk.radius) damageEnemy(e, sk.damage);
  }
  effects.push({type:"flash", x, y, t:0, life:0.3, r:sk.radius});
  effects.push({type:"ring",  x, y, t:0, life:0.4, r:sk.radius});
  spawnParticles(x, y, 30, {color:"#ffb24a", speed:240, size:4, life:0.6, grav:140});
  spawnParticles(x, y, 16, {color:"#ff5a2a", speed:180, size:4, life:0.5, grav:100});
  spawnParticles(x, y, 10, {color:"#cfcfcf", speed:70, size:7, life:0.8, lift:40, grow:18, kind:"smoke"});
  shake = Math.min(14, shake + 11);
  beep(90, 0.25, "sawtooth", 0.07);
  skillCd.meteor = sk.cd;
}
function castBlizzard() {
  const sk = SKILLS.blizzard;
  for (const e of enemies) {
    if (e.dead) continue;
    e.slowTimer = Math.max(e.slowTimer, sk.time); e.slowFactor = sk.slow;
  }
  for (let i = 0; i < 40; i++)
    spawnParticles(Math.random()*FIELD_W, Math.random()*FIELD_H - 20, 1,
      {color:"#dff4ff", speed:20, size:2.6, life:1.0, grav:60});
  effects.push({type:"frost", x:0, y:0, t:0, life:0.6});
  beep(500, 0.18, "sine", 0.06); beep(380, 0.22, "sine", 0.05);
  skillCd.blizzard = sk.cd;
}

// ---------------------------------------------------------------------
// 10) 웨이브 진행
// ---------------------------------------------------------------------
function startWave() {
  if (state !== "build" || waveIndex >= WAVES.length) return;
  // 이번 웨이브에 나올 적들을 시간표로 만들어 둡니다.
  spawnQueue = []; let t = 0;
  for (const g of WAVES[waveIndex]) {
    for (let i = 0; i < g.count; i++) { spawnQueue.push({type:g.type, t}); t += g.gap; }
    t += 0.6;
  }
  spawnIdx = 0; spawnClock = 0; state = "wave";
  waveTotal = spawnQueue.length;        // 진행바 계산용 총 적 수
  updateHUD();
}

function updateWaveSpawning(dt) {
  spawnClock += dt;
  while (spawnIdx < spawnQueue.length && spawnQueue[spawnIdx].t <= spawnClock) {
    spawnEnemy(spawnQueue[spawnIdx].type); spawnIdx++;
  }
  if (spawnIdx >= spawnQueue.length && enemies.length === 0) {
    // 웨이브 클리어!
    waveIndex++;
    if (waveIndex >= WAVES.length) { state = "won"; showOverlay("win"); }
    else {
      const bonus = 40 + waveIndex * 12;
      money += bonus; state = "build";
      effects.push({type:"text", x:FIELD_W/2, y:FIELD_H/2, t:0, life:1.6,
        txt:`웨이브 클리어! +💰${bonus}`});
      beep(523,0.1,"square",0.05); beep(784,0.12,"square",0.05);
    }
    updateHUD();
  }
}

// ---------------------------------------------------------------------
// 11) 메인 업데이트
// ---------------------------------------------------------------------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;          // 끊김 방지
  if (!paused && (state === "wave" || state === "build")) {
    const sdt = dt * gameSpeed;
    if (state === "wave") {
      updateWaveSpawning(sdt);
      enemies.forEach(e => updateEnemy(e, sdt));
    }
    SLOTS.forEach(s => { if (s.cat) updateCat(s.cat, sdt); });
    projectiles.forEach(p => updateProjectile(p, sdt));
    effects.forEach(f => f.t += sdt);
    updateParticles(sdt);
    enemies = enemies.filter(e => !e.dead);
    projectiles = projectiles.filter(p => !p.dead);
    effects = effects.filter(f => f.t < f.life);
    if (lives <= 0 && state !== "lost") { state = "lost"; showOverlay("lose"); }
    updateHUD();
  }
  shake = Math.max(0, shake - dt * 40);          // 화면 흔들림 잦아들기
  hurtFlash = Math.max(0, hurtFlash - dt * 2);
  if (!paused) {                                 // 필살기 재사용 대기시간
    skillCd.meteor = Math.max(0, skillCd.meteor - dt);
    skillCd.blizzard = Math.max(0, skillCd.blizzard - dt);
  }
  render();
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------
// 12) 그리기
// ---------------------------------------------------------------------
function render() {
  ctx.save();
  // 화면 흔들림(폭발/피격 시)
  if (shake > 0.1) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // 잔디 배경
  ctx.fillStyle = "#6fb24a"; ctx.fillRect(-12,-12,FIELD_W+24,FIELD_H+24);
  // 잔디 무늬
  ctx.fillStyle = "#67a644";
  for (let y=0;y<FIELD_H;y+=24) for (let x=((y/24)%2)*24;x<FIELD_W;x+=48)
    ctx.fillRect(x,y,24,24);

  drawScenery();
  drawPath();
  drawPortal();
  drawSlots();

  // 적
  for (const e of enemies) drawEnemy(e);
  drawBase();                                  // 우리집(적이 뒤로 사라짐)
  // 고양이
  for (const s of SLOTS) if (s.cat) drawCat(s.cat);
  // 발사체 (고양이마다 모양이 달라요)
  for (const p of projectiles) drawProjectile(p);
  // 파티클(불꽃·연기·반짝임)
  drawParticles();
  // 선택된 고양이의 사거리 표시
  if (selectedCat) drawRange(selectedCat.x, selectedCat.y, catStat(selectedCat).range, "#ffffff");
  // 효과(데미지 숫자·코인·링 등)
  for (const f of effects) drawEffect(f);
  // 배치 미리보기(상점에서 고른 상태로 빈 칸에 마우스 올림)
  if (selectedShop) drawPlacePreview();
  // 불벼락 조준 표시
  if (pendingSkill === "meteor") {
    drawRange(mouse.x, mouse.y, SKILLS.meteor.radius, "#ff7a2a");
    ctx.strokeStyle = "#ff7a2a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mouse.x-10, mouse.y); ctx.lineTo(mouse.x+10, mouse.y);
    ctx.moveTo(mouse.x, mouse.y-10); ctx.lineTo(mouse.x, mouse.y+10); ctx.stroke();
  }

  ctx.restore();

  // 우리집이 공격받으면 화면 가장자리가 붉게
  if (hurtFlash > 0) {
    ctx.save();
    const g = ctx.createRadialGradient(FIELD_W/2, FIELD_H/2, FIELD_H*0.3, FIELD_W/2, FIELD_H/2, FIELD_H*0.75);
    g.addColorStop(0, "rgba(220,40,40,0)");
    g.addColorStop(1, `rgba(220,30,30,${0.5*Math.min(1,hurtFlash)})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,FIELD_W,FIELD_H);
    ctx.restore();
  }
  // 은은한 비네팅(요즘 게임 느낌)
  if (!VIGNETTE) buildVignette();
  ctx.drawImage(VIGNETTE, 0, 0);

  drawTopBar();   // 상단 웨이브 진행바 + 다음 적 미리보기
}

// 현재/다음 웨이브의 적 구성 요약 {type:count}
function waveSummary(idx) {
  const m = {};
  if (idx < 0 || idx >= WAVES.length) return m;
  for (const g of WAVES[idx]) m[g.type] = (m[g.type] || 0) + g.count;
  return m;
}
function drawTopBar() {
  if (state !== "build" && state !== "wave") return;
  const bw = 392, bh = 40, bx = (FIELD_W - bw) / 2, by = 8;
  ctx.save();
  ctx.fillStyle = "rgba(20,14,40,.78)"; roundRect(bx, by, bw, bh, 12); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.15)"; ctx.lineWidth = 1; roundRect(bx, by, bw, bh, 12); ctx.stroke();

  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffd24a"; ctx.font = "bold 15px sans-serif";
  ctx.fillText(`🌊 WAVE ${Math.min(waveIndex+1, WAVES.length)}/${WAVES.length}`, bx+12, by+bh/2);

  if (state === "wave") {
    // 진행바
    const total = waveTotal || 1;
    const remain = (spawnQueue.length - spawnIdx) + enemies.length;
    const prog = Math.max(0, Math.min(1, 1 - remain / total));
    const px0 = bx+118, pw = 180, py0 = by+bh/2-6;
    ctx.fillStyle = "rgba(0,0,0,.4)"; roundRect(px0, py0, pw, 12, 6); ctx.fill();
    ctx.fillStyle = "#54d27a"; roundRect(px0, py0, pw*prog, 12, 6); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(`${Math.round(prog*100)}%`, px0+pw+22, by+bh/2);
  } else {
    // 다음 웨이브 적 미리보기
    ctx.fillStyle = "#cdbff2"; ctx.font = "12px sans-serif";
    ctx.fillText("다음:", bx+118, by+bh/2);
    const sum = waveSummary(waveIndex);
    let ix = bx+158;
    for (const type of Object.keys(sum)) {
      ctx.save(); ctx.translate(ix, by+bh/2+1); drawEnemyBody(ENEMY_TYPES[type], 1.7); ctx.restore();
      ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("×" + sum[type], ix+12, by+bh/2);
      ix += 50;
    }
  }
  ctx.restore();
}

let VIGNETTE = null;
function buildVignette() {
  const c = document.createElement("canvas");
  c.width = FIELD_W; c.height = FIELD_H;
  const g2 = c.getContext("2d");
  const grad = g2.createRadialGradient(FIELD_W/2, FIELD_H/2, FIELD_H*0.45, FIELD_W/2, FIELD_H/2, FIELD_H*0.8);
  grad.addColorStop(0, "rgba(0,0,0,0)");
  grad.addColorStop(1, "rgba(10,6,26,0.34)");
  g2.fillStyle = grad; g2.fillRect(0,0,FIELD_W,FIELD_H);
  VIGNETTE = c;
}

function drawPath() {
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = "#9c7e4e"; ctx.lineWidth = 54;   // 길 테두리(curb)
  pathStroke();
  ctx.strokeStyle = "#c7a86a"; ctx.lineWidth = 48;
  pathStroke();
  ctx.strokeStyle = "#d8bd86"; ctx.lineWidth = 34;
  pathStroke();
  // 길 위 자갈 점선 무늬
  ctx.strokeStyle = "rgba(155,126,78,.5)"; ctx.lineWidth = 4;
  ctx.setLineDash([2, 22]); pathStroke(); ctx.setLineDash([]);
}
function pathStroke() {
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i=1;i<WAYPOINTS.length;i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();
}

// ===== 배경 소품(나무·덤불·바위·꽃) =====
const PROPS = [
  {k:"tree",x:55,y:44},{k:"tree",x:300,y:40},{k:"tree",x:660,y:48},
  {k:"bush",x:150,y:52},{k:"bush",x:430,y:52},{k:"bush",x:600,y:38},{k:"bush",x:35,y:556},
  {k:"rock",x:34,y:470},
  {k:"flower",x:28,y:200,c:"#ff7aa8"},{k:"flower",x:30,y:340,c:"#ffe14a"},
  {k:"flower",x:220,y:56,c:"#ffffff"},{k:"flower",x:520,y:54,c:"#ff7aa8"},
  {k:"flower",x:120,y:50,c:"#9be0ff"},{k:"flower",x:380,y:56,c:"#ffe14a"},
];
function drawScenery() {
  for (const p of PROPS) {
    if (p.k === "tree") {
      ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.beginPath(); ctx.ellipse(p.x, p.y+22, 14, 4, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = "#7a5230"; ctx.fillRect(p.x-3, p.y+4, 6, 16);
      ctx.fillStyle = "#3f8f3a"; circle(p.x, p.y-6, 15); circle(p.x-10, p.y+2, 11); circle(p.x+10, p.y+2, 11);
      ctx.fillStyle = "#4fa944"; circle(p.x-3, p.y-9, 8); circle(p.x+5, p.y-3, 7);
    } else if (p.k === "bush") {
      ctx.fillStyle = "rgba(0,0,0,.1)"; ctx.beginPath(); ctx.ellipse(p.x, p.y+8, 16, 4, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = "#3f8f3a"; circle(p.x-8, p.y, 9); circle(p.x+8, p.y, 9); circle(p.x, p.y-4, 11);
      ctx.fillStyle = "#4fa944"; circle(p.x-3, p.y-4, 6);
    } else if (p.k === "rock") {
      ctx.fillStyle = "rgba(0,0,0,.1)"; ctx.beginPath(); ctx.ellipse(p.x, p.y+7, 14, 4, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = "#9aa0aa"; circle(p.x, p.y, 11); ctx.fillStyle = "#b6bcc6"; circle(p.x-3, p.y-3, 6);
    } else { // flower
      ctx.strokeStyle = "#3f8f3a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y+6); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = p.c;
      for (let a = 0; a < 5; a++) { const an = a/5*6.28; circle(p.x+Math.cos(an)*3, p.y+Math.sin(an)*3, 2.4); }
      ctx.fillStyle = "#ffd24a"; circle(p.x, p.y, 1.8);
    }
  }
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill(); }

// ===== 입구 포털(적 등장) =====
function drawPortal() {
  const x = 6, y = 90;
  ctx.fillStyle = "#5a4a86"; ctx.beginPath(); ctx.ellipse(x, y, 16, 26, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#2a2150"; ctx.beginPath(); ctx.ellipse(x, y, 10, 20, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#7a68b0";
  for (let i = -2; i <= 2; i++) { ctx.fillRect(x-3, y + i*9 - 2, 7, 4); }
}

// ===== 지켜야 할 우리집(기지) =====
function drawBase() {
  const x = 700, y = 552;
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x, y+26, 30, 7, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#e9d9b0"; roundRect(x-24, y-6, 48, 32, 4); ctx.fill();   // 벽
  ctx.fillStyle = "#c94f4f"; ctx.beginPath();                              // 지붕
  ctx.moveTo(x-30, y-4); ctx.lineTo(x, y-30); ctx.lineTo(x+30, y-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#8a5a3a"; roundRect(x-7, y+8, 14, 18, 2); ctx.fill();   // 문
  ctx.fillStyle = "#7fd0ff"; ctx.fillRect(x-18, y+2, 9, 9); ctx.fillRect(x+9, y+2, 9, 9); // 창문
  // 하트 + 남은 목숨
  ctx.fillStyle = "#ff5a7a"; heart(x, y-22, 5);
  ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(lives, x, y-18);
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s*0.7);
  ctx.bezierCurveTo(x, y, x - s, y - s*0.2, x - s, y - s*0.5);
  ctx.bezierCurveTo(x - s, y - s, x, y - s, x, y - s*0.4);
  ctx.bezierCurveTo(x, y - s, x + s, y - s, x + s, y - s*0.5);
  ctx.bezierCurveTo(x + s, y - s*0.2, x, y, x, y + s*0.7);
  ctx.fill();
}

function drawSlots() {
  for (const s of SLOTS) {
    if (s.cat) continue;
    const affordable = selectedShop && money >= selectedShop.cost;
    ctx.fillStyle = affordable ? "rgba(255,210,74,.35)" : "rgba(40,30,70,.25)";
    roundRect(s.x-22, s.y-22, 44, 44, 9); ctx.fill();
    ctx.strokeStyle = affordable ? "#ffd24a" : "rgba(255,255,255,.35)";
    ctx.lineWidth = 2;
    roundRect(s.x-22, s.y-22, 44, 44, 9); ctx.stroke();
    // 작은 발자국 표시
    ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 6.29); ctx.fill();
  }
}

function drawRange(x, y, r, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.globalAlpha = 0.55; ctx.lineWidth = 2;
  ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.stroke();
  ctx.globalAlpha = 0.10; ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

function catPalette(t) {
  return {o:t.outline, B:t.body, L:t.light, D:t.markings, p:"#ff9bb0", e:"#15151c", w:"#ffffff"};
}
function drawCat(c) {
  const t = CAT_BY_ID[c.type];
  const bob = Math.sin((performance.now()/260) + (c.x + c.y)) * 1.2;   // 평소 숨쉬기
  const hop = (c.firePop > 0) ? -Math.sin((c.firePop / 0.16) * Math.PI) * 5 : 0; // 발사 점프
  const x = c.x, y = c.y + bob + hop;
  const lvl = c.level || 1;
  // 바닥 그림자(흔들리지 않게 원래 위치 기준)
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.beginPath(); ctx.ellipse(x, c.y + 22, 15, 4.5, 0, 0, 6.29); ctx.fill();
  // Lv3은 황금빛 광채
  if (lvl >= 3) {
    const glow = 0.25 + Math.sin(performance.now()/200)*0.1;
    ctx.globalAlpha = glow; ctx.fillStyle = "#ffe14a";
    ctx.beginPath(); ctx.arc(x, y, 26, 0, 6.29); ctx.fill(); ctx.globalAlpha = 1;
  }
  decorateBehind(t, x, y);                 // 꼬리·갈기·망토 (몸 뒤)
  drawCatBody(t, x, y);                     // 매끈한 벡터 고양이
  decorateFront(c, t, x, y);               // 목걸이·가면·왕관 등 (몸 앞)
  // 레벨 별 표시 (머리 위)
  for (let i = 0; i < lvl; i++) {
    const sx = x - (lvl - 1) * 4 + i * 8, sy = y - 30;
    ctx.fillStyle = "#ffd24a"; ctx.strokeStyle = "#7a5a10"; ctx.lineWidth = 1;
    star(sx, sy, 3.4, 1.6); ctx.fill(); ctx.stroke();
  }
}
// 작은 별 모양 경로
function star(cx, cy, outer, inner) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? inner : outer, a = -Math.PI/2 + i * Math.PI/5;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

// 몸 뒤에 그리는 장식(꼬리, 사자 갈기, 호랑이 망토)
function decorateBehind(t, x, y) {
  ctx.save();
  if (t.id === "tiger") {                  // 대장님 망토
    ctx.fillStyle = "#b3322b";
    ctx.beginPath();
    ctx.moveTo(x-14, y+4); ctx.lineTo(x+14, y+4);
    ctx.lineTo(x+10, y+24); ctx.lineTo(x, y+18); ctx.lineTo(x-10, y+24); ctx.closePath(); ctx.fill();
  }
  // 꼬리 (오른쪽에서 위로 살랑)
  const sway = Math.sin(performance.now()/300 + x) * 3;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = t.outline; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(x+12, y+15);
  ctx.quadraticCurveTo(x+26, y+10, x+27 + sway, y - 6); ctx.stroke();
  ctx.strokeStyle = t.body; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x+12, y+15);
  ctx.quadraticCurveTo(x+26, y+10, x+27 + sway, y - 6); ctx.stroke();
  // 꼬리 끝 포인트색
  ctx.fillStyle = t.id === "lion" ? "#8a5e10" : t.light;
  ctx.beginPath(); ctx.arc(x+27 + sway, y - 6, 3.5, 0, 6.29); ctx.fill();

  if (t.id === "lion") {                   // 풍성한 갈기 (머리 둘레)
    ctx.fillStyle = "#c9881a";
    for (let a = 0; a < 14; a++) {
      const an = a / 14 * 6.28;
      ctx.beginPath(); ctx.arc(x + Math.cos(an) * 22, (y - 3) + Math.sin(an) * 22, 5, 0, 6.29); ctx.fill();
    }
    ctx.fillStyle = "#a86d12";
    for (let a = 0; a < 14; a++) {
      const an = (a + 0.5) / 14 * 6.28;
      ctx.beginPath(); ctx.arc(x + Math.cos(an) * 19, (y - 3) + Math.sin(an) * 19, 3, 0, 6.29); ctx.fill();
    }
  }
  ctx.restore();
}

// 몸 앞에 그리는 장식(소품). 캐릭터를 확실히 구분해줘요.
function decorateFront(c, t, x, y) {
  ctx.save();
  const blush = () => {
    ctx.fillStyle = "rgba(255,120,140,.45)";
    ctx.beginPath(); ctx.ellipse(x-10, y+1, 2.6, 1.8, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+10, y+1, 2.6, 1.8, 0, 0, 6.29); ctx.fill();
  };
  if (t.id === "basic") {                  // 🔔 빨간 목걸이 + 방울
    ctx.fillStyle = "#e0473e"; roundRect(x-13, y+8, 26, 5, 2); ctx.fill();
    ctx.fillStyle = "#ffd24a"; ctx.beginPath(); ctx.arc(x, y+12, 3.6, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#a9791a"; ctx.fillRect(x-0.6, y+11, 1.2, 3);
    blush();
  } else if (t.id === "sniper") {          // 🦝 흰 도둑 눈가면 + 노란 눈
    ctx.fillStyle = "#f1f1f6"; roundRect(x-14, y-9, 28, 8, 3); ctx.fill();
    ctx.fillStyle = "#ffe14a";
    ctx.beginPath(); ctx.ellipse(x-7, y-5, 2.6, 2, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+7, y-5, 2.6, 2, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#15151c";
    ctx.fillRect(x-8, y-6, 1.6, 3); ctx.fillRect(x+6.4, y-6, 1.6, 3);
  } else if (t.id === "snow") {            // 🧣 파란 목도리 + 머리 위 눈결정
    ctx.fillStyle = "#3aa0e0"; roundRect(x-13, y+8, 26, 6, 3); ctx.fill();
    ctx.fillRect(x+6, y+12, 5, 9);        // 늘어진 목도리 끝
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
    const cx = x, cy = y - 24;
    for (let a = 0; a < 6; a++) {
      const an = a / 6 * 6.28;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(an) * 5, cy + Math.sin(an) * 5); ctx.stroke();
    }
    blush();
  } else if (t.id === "lion") {            // 늠름한 눈썹
    ctx.fillStyle = t.outline;
    ctx.fillRect(x-9, y-8, 5, 2); ctx.fillRect(x+4, y-8, 5, 2);
  } else if (t.id === "tiger") {           // 👑 왕관 + 송곳니
    ctx.fillStyle = "#ffd24a";
    ctx.beginPath();
    ctx.moveTo(x-11, y-15); ctx.lineTo(x-11, y-21); ctx.lineTo(x-6, y-17);
    ctx.lineTo(x, y-23); ctx.lineTo(x+6, y-17); ctx.lineTo(x+11, y-21);
    ctx.lineTo(x+11, y-15); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e0473e"; ctx.beginPath(); ctx.arc(x, y-18, 1.6, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#ffffff";               // 송곳니
    ctx.beginPath(); ctx.moveTo(x-4, y+3); ctx.lineTo(x-2, y+3); ctx.lineTo(x-3, y+6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+2, y+3); ctx.lineTo(x+4, y+3); ctx.lineTo(x+3, y+6); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// 발사체를 고양이 종류(shape)에 맞게 다르게 그립니다.
function drawProjectile(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.shadowColor = p.color; ctx.shadowBlur = 8;   // 네온 발광(요즘 느낌)
  if (p.shape === "fish") {
    // 🐟 물고기: 작은 타원 몸통 + 꼬리지느러미
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(-11,-4); ctx.lineTo(-11,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#15151c"; ctx.fillRect(3, -2, 2, 2); // 눈

  } else if (p.shape === "dart") {
    // 🗡️ 발톱 표창: 길고 빠른 바늘 + 잔상
    for (let i = 0; i < p.trail.length; i++) {
      const tp = p.trail[i]; ctx.globalAlpha = (i / p.trail.length) * 0.5;
      ctx.fillStyle = p.color;
      ctx.fillRect(tp.x - p.x - 1, tp.y - p.y - 1, 3, 3);
    }
    ctx.globalAlpha = 1; ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,-3); ctx.lineTo(-3,0); ctx.lineTo(-6,3); ctx.closePath(); ctx.fill();

  } else if (p.shape === "snowflake") {
    // ❄️ 눈송이: 회전하는 6갈래 결정 + 옅은 자국
    ctx.rotate(p.spin);
    ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.lineCap = "round";
    for (let a = 0; a < 6; a++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(2,-6); ctx.moveTo(0,-4); ctx.lineTo(-2,-6); ctx.stroke();
    }

  } else if (p.shape === "fireball") {
    // 🔥 불덩이: 깜빡이는 불꽃 글로우
    const flick = 5 + Math.sin(p.spin * 3) * 1.5;
    ctx.globalAlpha = 0.4; ctx.fillStyle = "#ff7a1a";
    ctx.beginPath(); ctx.arc(0, 0, flick + 3, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, flick, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#fff3b0";
    ctx.beginPath(); ctx.arc(0, 0, flick - 3, 0, 6.29); ctx.fill();

  } else { // orb (호랑냥) — ⚡ 번개 기운 구슬
    for (let i = 0; i < p.trail.length; i++) {
      const tp = p.trail[i]; ctx.globalAlpha = (i / p.trail.length) * 0.4;
      ctx.fillStyle = "#ffd24a";
      ctx.beginPath(); ctx.arc(tp.x - p.x, tp.y - p.y, 3, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ff7a1a";
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, 6.29); ctx.fill();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.29); ctx.fill();
    // 번개 스파크
    ctx.strokeStyle = "#fff7d0"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-7, -2); ctx.lineTo(-2, 0); ctx.lineTo(-5, 3);
    ctx.moveTo(7, -3); ctx.lineTo(2, 0); ctx.lineTo(6, 2); ctx.stroke();
  }
  ctx.restore();
}

function enemyPalette(e) {
  return {o:e.outline, B:e.body, L:e.light, D:e.dark, p:"#ff9bb0", e:e.eye, w:"#ffffff"};
}
// 전부 한 색으로 칠하는 팔레트 (피격 번쩍임=흰색, 얼음=파랑)
const WHITE_PAL = {o:"#fff",B:"#fff",L:"#fff",D:"#fff",p:"#fff",e:"#fff",w:"#fff"};
const ICE_PAL = {o:"#7fd0ff",B:"#7fd0ff",L:"#7fd0ff",D:"#7fd0ff",p:"#7fd0ff",e:"#7fd0ff",w:"#7fd0ff"};

function drawEnemy(e) {
  const grid = ENEMY_GRIDS[e.art];
  const gw = grid[0].length, gh = grid.length, px = e.px;
  const wob = Math.sin(e.wob) * 1.5;
  const fly = e.flying ? -16 + Math.sin(e.wob*0.5)*2 : 0;   // 비행 적은 떠 있음

  // 바닥 그림자 (뒤집지 않음, 원래 자리)
  ctx.fillStyle = e.flying ? "rgba(0,0,0,.10)" : "rgba(0,0,0,.16)";
  ctx.beginPath(); ctx.ellipse(e.x, e.y + gh*px*0.42, gw*px*(e.flying?0.26:0.34), px*1.2, 0, 0, 6.29); ctx.fill();

  // 몸+장식은 '가는 방향'으로 좌우 반전해서 그립니다.
  ctx.save();
  ctx.translate(e.x, e.y + wob + fly);
  ctx.scale(e.face || 1, 1);
  if (e.style === "ghost") ctx.globalAlpha = 0.82;             // 유령은 반투명
  decorateEnemyBehind(e);                       // 박쥐 날개·꼬리 등 (뒤)
  drawEnemyBody(e, px);                          // 매끈한 벡터 적
  decorateEnemyFront(e);                         // 눈썹·소품 등 (앞)
  ctx.globalAlpha = 1;
  if (e.slowTimer > 0) {                         // 얼음(느려짐) 표시
    ctx.globalAlpha = 0.4; drawEnemyBody(e, px, "#7fd0ff"); ctx.globalAlpha = 1;
  }
  if (e.flash > 0) {                            // 피격 번쩍
    ctx.globalAlpha = Math.min(1, e.flash / 0.1) * 0.85;
    drawEnemyBody(e, px, "#ffffff"); ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 보호막(방패) 거품
  if (e.shield > 0) {
    const a = 0.25 + 0.4*(e.shield/e.maxShield), rr = gw*px*0.55 + 5;
    ctx.strokeStyle = `rgba(120,220,255,${a})`; ctx.fillStyle = `rgba(120,220,255,${a*0.22})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y + wob + fly - gh*px*0.05, rr, 0, 6.29); ctx.fill(); ctx.stroke();
  }
  // 체력바 (뒤집지 않음)
  if (e.hp < e.maxHp || e.shield > 0) {
    const w = Math.max(26, gw*px*0.7), bx = e.x - w/2, by = e.y + fly - gh*px*0.6 - 6;
    ctx.fillStyle = "#2a1f3a"; ctx.fillRect(bx-1, by-1, w+2, 6);
    ctx.fillStyle = "#e74c4c"; ctx.fillRect(bx, by, w, 4);
    ctx.fillStyle = "#5ee06a"; ctx.fillRect(bx, by, w * Math.max(0,e.hp)/e.maxHp, 4);
    if (e.maxShield > 0) {   // 방패 바(파랑)
      ctx.fillStyle = "#7fd0ff"; ctx.fillRect(bx, by-4, w * Math.max(0,e.shield)/e.maxShield, 3);
    }
  }
}

// 적의 몸 뒤 장식 (중심 0,0 기준 / 꼬리는 뒤쪽으로)
function decorateEnemyBehind(e) {
  ctx.save();
  const px = e.px;
  if (e.style === "bat") {                       // 펄럭이는 날개
    const flap = Math.sin(performance.now()/90) * 6;
    const w = px*6;
    ctx.fillStyle = e.dark; ctx.strokeStyle = e.outline; ctx.lineWidth = 1;
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(s*5, -2);
      ctx.lineTo(s*(5+w), -w*0.5 - flap);
      ctx.lineTo(s*(5+w), 2);
      ctx.lineTo(s*(5+w*0.6), -1);
      ctx.lineTo(s*(5+w*0.7), 5);
      ctx.closePath(); ctx.fill();
    });
  } else if (e.style === "mouse") {              // 긴 꼬리(뒤쪽=왼쪽)
    const sway = Math.sin(performance.now()/240 + e.x) * 4;
    ctx.strokeStyle = e.dark; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-2, 16);
    ctx.quadraticCurveTo(-16, 18, -15 - sway, 4); ctx.stroke();
  } else {                                        // 강아지류 흔드는 꼬리(뒤쪽=왼쪽)
    const sway = Math.sin(performance.now()/160 + e.x) * 5;
    const bx = -px*5.5, by = px*2;
    ctx.strokeStyle = e.outline; ctx.lineWidth = px*1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx - px*2, by - px*2, bx - px*2 + sway, by - px*4); ctx.stroke();
    ctx.strokeStyle = e.body; ctx.lineWidth = px*0.9;
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx - px*2, by - px*2, bx - px*2 + sway, by - px*4); ctx.stroke();
  }
  ctx.restore();
}

// 적의 몸 앞 장식 (중심 0,0 기준)
function decorateEnemyFront(e) {
  ctx.save();
  const px = e.px, gh = ENEMY_GRIDS[e.art].length;
  if (e.style === "mouse") {                     // 짓궂은 눈썹 + 수염
    ctx.strokeStyle = e.dark; ctx.lineWidth = 1.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-9, -8); ctx.lineTo(-4, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -8); ctx.lineTo(4, -6); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1;
    [-1,1].forEach(s => { ctx.beginPath();
      ctx.moveTo(s*4, 4); ctx.lineTo(s*16, 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*4, 6); ctx.lineTo(s*16, 7); ctx.stroke(); });
  } else if (e.style === "bat") {                // 작은 송곳니
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.moveTo(-3, 6); ctx.lineTo(-1, 6); ctx.lineTo(-2, 10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(1, 6); ctx.lineTo(3, 6); ctx.lineTo(2, 10); ctx.closePath(); ctx.fill();
  } else if (e.style === "ghost") {              // 유령 입(오~)
    ctx.fillStyle = "#6a4a9a";
    ctx.beginPath(); ctx.ellipse(0, 6, 2.4, 3, 0, 0, 6.29); ctx.fill();
  } else {                                        // 강아지 계열 = 짓궂은 눈썹
    ctx.strokeStyle = e.outline; ctx.lineWidth = 2; ctx.lineCap = "round";
    const ey = -px*3;
    ctx.beginPath(); ctx.moveTo(-px*4, ey - px); ctx.lineTo(-px*1.5, ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px*4, ey - px); ctx.lineTo(px*1.5, ey); ctx.stroke();
  }
  if (e.style === "bigdog") {                    // 가시 목걸이
    const cy = px*3.5;
    ctx.fillStyle = "#444"; roundRect(-px*5, cy, px*10, px*1.6, 2); ctx.fill();
    ctx.fillStyle = "#cfcfcf";
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i*px*2 - 2, cy + px*1.6);
      ctx.lineTo(i*px*2 + 2, cy + px*1.6); ctx.lineTo(i*px*2, cy + px*3); ctx.closePath(); ctx.fill();
    }
  }
  if (e.style === "boss") {                       // 👑 가시왕관 + 안대 + 침
    const topY = -gh*px*0.5;
    ctx.fillStyle = "#ffd24a";
    ctx.beginPath();
    ctx.moveTo(-px*5, topY+px*2); ctx.lineTo(-px*5, topY-px*2); ctx.lineTo(-px*2.5, topY);
    ctx.lineTo(0, topY-px*3); ctx.lineTo(px*2.5, topY); ctx.lineTo(px*5, topY-px*2);
    ctx.lineTo(px*5, topY+px*2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#15151c";                    // 안대
    ctx.fillRect(px*1.5, -px*3.5, px*3.5, px*2.2);
    ctx.strokeStyle = "#15151c"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px*1.5, -px*4.5); ctx.lineTo(px*5.5, -px*2.5); ctx.stroke();
    ctx.fillStyle = "#bfe6ff";                    // 침 한 방울
    ctx.beginPath(); ctx.arc(-px*3, px*4 + Math.sin(performance.now()/300)*2, px*0.8, 0, 6.29); ctx.fill();
  }
  ctx.restore();
}

function drawEffect(f) {
  const k = f.t / f.life;
  if (f.type === "coin") {
    ctx.globalAlpha = 1 - k; ctx.fillStyle = "#ffd24a";
    ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(f.lvup ? "LV UP!" : ("+" + f.val), f.x, f.y - 14 - k*16); ctx.globalAlpha = 1;
  } else if (f.type === "ring") {
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = "#fff7d0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r*k, 0, 6.29); ctx.stroke(); ctx.globalAlpha = 1;
  } else if (f.type === "poof") {           // 사라지는 연기 구름
    ctx.globalAlpha = (1 - k) * 0.8; ctx.fillStyle = "#f0ecff";
    ctx.beginPath(); ctx.arc(f.x + f.dx*k, f.y + f.dy*k, f.r*(0.6 + k*0.8), 0, 6.29); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (f.type === "flash") {          // 발광 섬광(폭발/총구)
    ctx.globalAlpha = (1 - k) * 0.9;
    const grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r*(0.6+k));
    grd.addColorStop(0, "#fffde0"); grd.addColorStop(0.5, "#ffd24a"); grd.addColorStop(1, "rgba(255,180,60,0)");
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(f.x, f.y, f.r*(0.6+k), 0, 6.29); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (f.type === "frost") {          // 눈보라 전체 섬광
    ctx.globalAlpha = (1 - k) * 0.4; ctx.fillStyle = "#aee8ff";
    ctx.fillRect(0, 0, FIELD_W, FIELD_H); ctx.globalAlpha = 1;
  } else if (f.type === "dmg") {            // 떠오르는 데미지 숫자
    ctx.globalAlpha = Math.min(1, 2.2 - 2.2*k); ctx.textAlign = "center";
    ctx.font = `bold ${f.big ? 20 : 14}px sans-serif`;
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(40,20,10,.8)";
    ctx.fillStyle = f.big ? "#ffd24a" : "#ffffff";
    const yy = f.y - k*22;
    ctx.strokeText(f.val, f.x, yy); ctx.fillText(f.val, f.x, yy); ctx.globalAlpha = 1;
  } else if (f.type === "text") {
    ctx.globalAlpha = Math.min(1, 2-2*k); ctx.fillStyle = "#fff";
    ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.strokeStyle = "#6b3fb0"; ctx.lineWidth = 5;
    ctx.strokeText(f.txt, f.x, f.y); ctx.fillText(f.txt, f.x, f.y); ctx.globalAlpha = 1;
  }
}

function drawPlacePreview() {
  // 마우스에서 가장 가까운 빈 슬롯에 미리보기
  let near = null, nd = 9999;
  for (const s of SLOTS) {
    if (s.cat) continue;
    const d = Math.hypot(s.x-mouse.x, s.y-mouse.y);
    if (d < nd) { nd = d; near = s; }
  }
  if (near && nd < 40) {
    drawRange(near.x, near.y, selectedShop.range, "#ffd24a");
    ctx.globalAlpha = 0.65;
    decorateBehind(selectedShop, near.x, near.y);
    drawCatBody(selectedShop, near.x, near.y);
    decorateFront({}, selectedShop, near.x, near.y);
    ctx.globalAlpha = 1;
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// ---------------------------------------------------------------------
// 13) 입력 (마우스 클릭으로 고양이 배치/선택)
// ---------------------------------------------------------------------
canvas.addEventListener("mousemove", ev => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (ev.clientX - r.left) * (FIELD_W / r.width);
  mouse.y = (ev.clientY - r.top) * (FIELD_H / r.height);
});
canvas.addEventListener("click", ev => {
  const r = canvas.getBoundingClientRect();
  const mx = (ev.clientX - r.left) * (FIELD_W / r.width);
  const my = (ev.clientY - r.top) * (FIELD_H / r.height);
  // 불벼락 조준 중이면 그 자리에 떨어뜨림
  if (pendingSkill === "meteor") {
    if (skillCd.meteor <= 0) castMeteor(mx, my);
    pendingSkill = null; updateHUD(); return;
  }
  // 가장 가까운 슬롯 찾기
  let near = null, nd = 9999;
  for (const s of SLOTS) {
    const d = Math.hypot(s.x-mx, s.y-my);
    if (d < nd) { nd = d; near = s; }
  }
  if (!near || nd > 30) { selectedCat = null; updateSelBox(); return; }

  if (near.cat) {            // 이미 고양이가 있으면 → 선택(정보/판매)
    selectedCat = near.cat; selectedShop = null; refreshShop(); updateSelBox();
  } else if (selectedShop) { // 상점 고양이를 고른 상태면 → 배치
    if (money >= selectedShop.cost) {
      money -= selectedShop.cost;
      near.cat = { type: selectedShop.id, x: near.x, y: near.y, slot: near, cd: 0, face: 1,
                   level: 1, invested: selectedShop.cost, targeting: "first" };
      beep(440, 0.08, "square", 0.05);
      selectedCat = near.cat; updateSelBox();
      updateHUD(); refreshShop();
    } else {
      beep(160, 0.12, "sawtooth", 0.05); // 돈 부족
    }
  } else {
    selectedCat = null; updateSelBox();
  }
});

// ---------------------------------------------------------------------
// 14) 오른쪽 패널 UI
// ---------------------------------------------------------------------
const shopEl = document.getElementById("shop");
// 연사 속도를 별(★)로 표현: 쿨다운이 짧을수록 별이 많아요.
function speedStars(cd) {
  const n = cd <= 0.45 ? 5 : cd <= 0.6 ? 4 : cd <= 0.85 ? 3 : cd <= 1.2 ? 2 : 1;
  return "★".repeat(n) + "☆".repeat(5 - n);
}
function statLine(t) {
  return `🎯${t.range}　⚔️${t.damage}　⚡${speedStars(t.cooldown)}　${t.air?"✈️":"🚫✈️"}`;
}
// 가격대로 등급(희귀도) 색을 정해 카드 느낌을 줍니다.
function rarity(cost) {
  if (cost <= 80)  return {name:"일반",   col:"#9aa0aa"};
  if (cost <= 180) return {name:"고급",   col:"#4fa9ff"};
  if (cost <= 300) return {name:"희귀",   col:"#b06fe0"};
  return {name:"전설", col:"#ffc23a"};
}
function buildShop() {
  shopEl.innerHTML = "";
  for (const t of CAT_TYPES) {
    const r = rarity(t.cost);
    const b = document.createElement("div");
    b.className = "catbtn"; b.dataset.id = t.id;
    b.title = t.desc;   // 마우스를 올리면 설명이 풍선으로 뜸
    b.style.borderLeft = `5px solid ${r.col}`;
    b.innerHTML = `<div class="ico" style="background:${r.col}22;border:1.5px solid ${r.col}66">${t.ico}</div>
      <div class="info">
        <div class="nmrow"><span class="nm">${t.name} <span class="rar" style="color:${r.col}">●${r.name}</span></span><span class="cost">💰${t.cost}</span></div>
        <div class="stats">${statLine(t)}</div>
      </div>`;
    b.addEventListener("click", () => {
      selectedShop = (selectedShop && selectedShop.id === t.id) ? null : t;
      selectedCat = null; updateSelBox(); refreshShop();
    });
    shopEl.appendChild(b);
  }
}
function refreshShop() {
  for (const b of shopEl.children) {
    const t = CAT_BY_ID[b.dataset.id];
    b.classList.toggle("selected", selectedShop && selectedShop.id === t.id);
    b.classList.toggle("locked", money < t.cost);
  }
}
function updateSelBox() {
  const box = document.getElementById("selBox");
  if (!selectedCat) { box.style.display = "none"; return; }
  const c = selectedCat, t = CAT_BY_ID[c.type], s = catStat(c);
  const lvStars = "★".repeat(c.level) + "☆".repeat(MAX_LEVEL - c.level);
  const maxed = c.level >= MAX_LEVEL;
  const cost = upgradeCost(c);
  const canUp = !maxed && money >= cost;
  box.style.display = "block";
  const TGT = {first:"맨앞", last:"맨뒤", strong:"강한적", weak:"약한적"};
  const bs = "border:none;border-radius:8px;padding:7px 4px;font-size:12px;font-weight:bold;cursor:pointer;color:#1b1530;";
  const extra = `${s.splash?"💥범위 ":""}${s.slow?"🧊슬로우 ":""}${t.air?"<span style='color:#9be0ff'>✈️비행</span>":"<span style='color:#9aa0aa'>🚫비행</span>"}`;
  box.innerHTML = `<b>${t.ico} ${t.name}</b> <span style="color:#ffd24a">Lv.${c.level} ${lvStars}</span><br>
    🎯${Math.round(s.range)} · ⚔️${s.damage} · ⚡${speedStars(s.cooldown)}<br>${extra}
    <button id="tgtBtn" style="${bs}width:100%;margin-top:6px;background:#6a5aa8;color:#fff">🎯 우선순위: ${TGT[c.targeting||"first"]}</button>
    <div style="display:flex;gap:5px;margin-top:5px">
      <button id="upBtn" ${canUp?"":"disabled"} style="${bs}flex:1.4;background:${maxed?'#4a5560':'#ffd24a'};color:${maxed?'#9aa':'#1b1530'}">
        ${maxed ? "⭐MAX" : `⬆ Lv.${c.level+1} 💰${cost}`}</button>
      <button id="sellBtn" style="${bs}flex:1;background:#e06a6a;color:#fff">↩💰${Math.floor(c.invested*0.6)}</button>
    </div>`;

  document.getElementById("tgtBtn").onclick = () => {
    const order = ["first","last","strong","weak"];
    c.targeting = order[(order.indexOf(c.targeting||"first") + 1) % order.length];
    updateSelBox(); beep(440,0.04,"square",0.04);
  };
  const upBtn = document.getElementById("upBtn");
  if (upBtn && canUp) upBtn.onclick = () => {
    money -= cost; c.invested += cost; c.level++;
    beep(523,0.07,"square",0.05); beep(784,0.09,"square",0.05);
    effects.push({type:"coin", x:c.x, y:c.y-20, t:0, life:0.8, val:0, lvup:true});
    updateSelBox(); updateHUD(); refreshShop();
  };
  document.getElementById("sellBtn").onclick = () => {
    money += Math.floor(c.invested * 0.6);
    c.slot.cat = null; selectedCat = null;
    updateSelBox(); updateHUD(); refreshShop();
    beep(330,0.08,"square",0.05);
  };
}
function updateHUD() {
  document.getElementById("money").textContent = money;
  document.getElementById("lives").textContent = lives;
  document.getElementById("wave").textContent = (waveIndex < WAVES.length ? waveIndex+1 : WAVES.length) + " / " + WAVES.length;
  const sw = document.getElementById("startWave");
  sw.disabled = (state !== "build");
  sw.textContent = (state === "build") ? `▶ 웨이브 ${waveIndex+1} 시작` : "⚔ 방어 중...";
  // 업그레이드 버튼 구매가능 여부를 매 프레임 가볍게 갱신 (selBox 통째 재생성 없이)
  const upBtn = document.getElementById("upBtn");
  if (upBtn && selectedCat && selectedCat.level < MAX_LEVEL) {
    const can = money >= upgradeCost(selectedCat);
    if (upBtn.disabled === can) {               // 상태가 바뀌었을 때만
      upBtn.disabled = !can;
      if (!upBtn.onclick && can) updateSelBox(); // 비활성→활성 시 핸들러 복구
    }
  }
  updateSkillButtons();
  refreshShop();
}
function updateSkillButtons() {
  [["skillMeteor","meteor"], ["skillBlizzard","blizzard"]].forEach(([id, key]) => {
    const b = document.getElementById(id); const sk = SKILLS[key]; const cd = skillCd[key];
    b.disabled = !(cd <= 0 && state === "wave" && !paused);
    b.classList.toggle("armed", key === "meteor" && pendingSkill === "meteor");
    b.textContent = cd > 0 ? `${sk.ico} ${Math.ceil(cd)}초` : `${sk.ico} ${sk.name}`;
  });
}
document.getElementById("skillMeteor").onclick = () => {
  if (skillCd.meteor <= 0 && state === "wave")
    pendingSkill = (pendingSkill === "meteor") ? null : "meteor";
  updateSkillButtons();
};
document.getElementById("skillBlizzard").onclick = () => {
  if (skillCd.blizzard <= 0 && state === "wave") { castBlizzard(); updateHUD(); }
};

document.getElementById("startWave").onclick = startWave;
document.getElementById("speedBtn").onclick = (e) => {
  gameSpeed = gameSpeed === 1 ? 2 : 1;
  e.target.textContent = "⏩ " + gameSpeed + "x";
};
document.getElementById("pauseBtn").onclick = (e) => {
  paused = !paused;
  e.target.textContent = paused ? "▶" : "⏸";
  if (paused) stopBgm(); else startBgm();   // 일시정지 때 음악도 멈춤
};
document.getElementById("musicBtn").onclick = (e) => {
  bgmOn = !bgmOn;
  e.target.textContent = bgmOn ? "🎵" : "🎶";
  e.target.style.opacity = bgmOn ? "1" : "0.4";
  if (bgmOn) startBgm(); else stopBgm();
};
document.getElementById("soundBtn").onclick = (e) => {
  muted = !muted; e.target.textContent = muted ? "🔇" : "🔊";
  if (muted) stopBgm(); else startBgm();     // 음소거 때 음악도 멈춤
};

// ---------------------------------------------------------------------
// 15) 시작/종료 오버레이
// ---------------------------------------------------------------------
const overlay = document.getElementById("overlay");
const overlayBtn = document.getElementById("overlayBtn");
const diffRow = document.getElementById("diffRow");

// 난이도 선택 버튼을 그립니다 (시작/다시하기 화면)
function buildDiffButtons() {
  diffRow.innerHTML = "";
  for (const key of ["easy","normal","hard"]) {
    const d = DIFFS[key];
    const b = document.createElement("button");
    b.style.background = d.col;
    b.innerHTML = `${d.name}<br><span style="font-size:11px;font-weight:normal">❤️${d.lives} 💰${d.money}</span>`;
    b.onclick = () => {
      difficulty = key;
      overlay.classList.add("hidden");
      resetGame(); initAudio(); startBgm();
    };
    diffRow.appendChild(b);
  }
}
function showStartScreen() {
  overlay.classList.remove("hidden");
  overlay.querySelector("h2").textContent = "🐱 고양이 영웅 디펜스";
  overlay.querySelector("p").innerHTML = "밀려오는 군단을 막아라!<br>난이도를 골라 시작하세요.";
  diffRow.style.display = "flex";
  buildDiffButtons();
}
function showOverlay(kind) {
  overlay.classList.remove("hidden");
  diffRow.style.display = "flex";
  const h = overlay.querySelector("h2"), p = overlay.querySelector("p");
  if (kind === "win") {
    h.textContent = "🎉 승리! 🎉";
    p.innerHTML = "모든 웨이브를 막아냈어요!<br>다시 도전할 난이도를 고르세요. 🐱";
    beep(523,0.1); beep(659,0.1); beep(784,0.15);
  } else if (kind === "lose") {
    h.textContent = "💥 패배...";
    p.innerHTML = "적들이 우리집을 점령했어요.<br>난이도를 골라 다시 도전! 🐾";
  }
  buildDiffButtons();
}

// ---------------------------------------------------------------------
// 16) 시작!
// ---------------------------------------------------------------------
buildShop();
resetGame();
showStartScreen();      // 난이도 선택 화면부터
requestAnimationFrame(loop);
</script>
</body>
</html>
